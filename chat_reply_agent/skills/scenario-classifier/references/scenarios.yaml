scenarios:
  daily_chat:
    label: 日常聊天
    risk_level: low
    description: 普通分享、闲聊、问答或轻松接话，没有明显关系风险。
    reply_goal: 顺着当前话题自然接住，保持聊天节奏。
    classification_signals:
      - 对方在分享日常、问小事、接普通话题。
      - 没有明显指责、拒绝、冷淡、求安慰或任务压力。
    principles:
      - 直接回应对方最后一句。
      - 可以轻松一点，不必过度分析。
      - 不要把普通聊天突然拉高到关系层面。
    emotional_intelligence:
      - 对方轻松时保持轻松。
      - 对方只是问事实时直接答，不要过度关心。
      - 适合用一个轻问题让话题继续。
    reply_moves:
      - 顺着接一句。
      - 补一点自己的反应。
      - 必要时问一个轻问题。
    avoid:
      - 突然上价值
      - 把简单话题回复得太郑重
      - 没必要地道歉或安慰
    timing:
      default_delay: 按平时节奏回复
      reason: 日常聊天不需要刻意计算时间，保持自然即可。
    natural_examples:
      - 哈哈确实
      - 行，那就这样
      - 然后呢
      - 这也可以
      - 有点意思
      - 那还挺方便

  apology:
    label: 道歉与修复
    risk_level: medium
    description: 一方在道歉、承认问题，或当前重点是修复误会和关系。
    reply_goal: 明确回应歉意或承担责任，并给出一个具体修复动作。
    classification_signals:
      - 出现“对不起、抱歉、是我不对、我的错、刚刚不该”等表达。
      - 对方正在给修复窗口，或用户需要补救刚才的话。
    principles:
      - 道歉要落到具体事情。
      - 少解释动机，先处理造成的影响。
      - 修复动作要小而具体，不要空泛保证。
    emotional_intelligence:
      - 对方道歉时，接住即可，不要继续追责。
      - 自己道歉时，先承认影响，再补一句怎么做。
      - 不用长篇自证稀释歉意。
    reply_moves:
      - 承认具体问题。
      - 补一句修复动作。
      - 给对方台阶继续聊。
    avoid:
      - 道歉后立刻甩锅
      - 用长篇自证稀释歉意
      - 用“但是”把道歉转成辩解
    timing:
      default_delay: 尽快回复
      reason: 修复窗口已经出现，及时给出明确态度更合适。
    natural_examples:
      - 这次确实是我不对
      - 行，我补上
      - 刚刚那句说重了
      - 我晚点认真说
      - 嗯，这个我改
      - 刚才没接好

  comfort:
    label: 安慰与支持
    risk_level: medium
    description: 对方表达难过、疲惫、压力、委屈或需要被陪伴。
    reply_goal: 先接住感受，再根据对方状态提供陪伴或具体帮助。
    classification_signals:
      - 对方说累、烦、难过、委屈、崩溃、压力大。
      - 对方不一定要解决方案，可能只是需要被听见。
    principles:
      - 先回应感受，不急着解决问题。
      - 帮助要具体且给对方选择。
      - 不要把安慰写成讲道理。
    emotional_intelligence:
      - 先站到对方身边，再谈怎么办。
      - 不说“想开点”“别难过了”这种轻飘话。
      - 可以给一个小行动，比如“我在/我听你说/先歇会儿”。
    reply_moves:
      - 接住感受。
      - 表示陪伴。
      - 轻轻给选择或小帮助。
    avoid:
      - 讲大道理
      - 轻描淡写地说想开点
      - 立刻评价谁对谁错
    timing:
      default_delay: 尽快回复
      reason: 对方正在释放情绪，及时回应能减少被忽视感。
    natural_examples:
      - 啊这也太难受了
      - 我在呢，慢慢说
      - 先歇会儿，别硬撑
      - 这事换谁都烦
      - 先别自己扛着
      - 听着就很累

  invitation:
    label: 邀约与安排
    risk_level: low
    description: 发起、接受、调整或确认见面和共同活动。
    reply_goal: 清楚表达意愿，并给出可执行的时间或下一步。
    classification_signals:
      - 出现一起、见面、吃饭、电影、几点、周末、有空等安排信息。
      - 当前核心是确认去不去、什么时候、谁来定。
    principles:
      - 愿意就明确回应。
      - 不方便时给替代时间。
      - 不要一直模糊说再看。
    emotional_intelligence:
      - 接受邀约时给对方一个明确反馈。
      - 拒绝时留一点温度或替代方案。
      - 追求阶段不要给太满压力，已确认关系可更直接。
    reply_moves:
      - 明确愿意或不方便。
      - 给时间、地点或下一步。
      - 不确定时说明什么时候确认。
    avoid:
      - 一直模糊说再看
      - 不想去却勉强承诺
      - 拒绝后完全不给台阶
    timing:
      default_delay: 方便时尽快确认
      reason: 邀约通常涉及双方安排，明确回复比拖延更友好。
    natural_examples:
      - 可以啊，几点
      - 今天不行，周末呢
      - 行，地方你定
      - 我看看时间
      - 可以，晚点定
      - 那就周六？

  conflict:
    label: 冲突与争执
    risk_level: high
    description: 对话里有明显指责、防御、失望、愤怒或对立升级。
    reply_goal: 先降低对抗，确认争议焦点，再讨论事实或解决办法。
    classification_signals:
      - 出现凭什么、你总是、算了、随便、别烦、失望、吵架等信号。
      - 双方都可能在防御，继续立刻输出观点会升级。
    principles:
      - 只处理当前问题。
      - 先停住攻击和反击。
      - 不急着赢，先让对话还能继续。
    emotional_intelligence:
      - 先承认对方有不舒服的点，不等于全盘认错。
      - 不用反问压迫对方。
      - 如果自己情绪也上来了，先短暂缓一下再回。
    reply_moves:
      - 降温一句。
      - 只认当前可认的一点。
      - 把话题拉回具体事情。
      - 必要时提出晚点再说。
    avoid:
      - 反问压迫
      - 翻旧账或威胁关系
      - 立刻长篇解释
      - 阴阳怪气
    timing:
      should_reply_now: false
      default_delay: 冷静 15-30 分钟后回复
      reason: 冲突中立即反击容易升级，短暂整理后回应更稳妥。
    natural_examples:
      - 我先不跟你顶
      - 这句我确实说重了
      - 先把这件事说清楚
      - 我缓一下再回你
      - 别先吵起来
      - 我们先说这件事

  refusal:
    label: 拒绝与婉拒
    risk_level: medium
    description: 一方不接受请求、邀约、安排或关系推进。
    reply_goal: 尊重拒绝并清楚表达边界，不纠缠也不过度自我否定。
    classification_signals:
      - 出现不行、不了、没空、不方便、算了、下次吧等拒绝信息。
      - 对方可能是在保护边界，不适合继续追问。
    principles:
      - 接受明确答案。
      - 必要时只确认一次原因或替代方案。
      - 不用委屈感逼对方改变决定。
    emotional_intelligence:
      - 给对方台阶，别让拒绝变尴尬。
      - 自己拒绝时，也给简短原因或替代方案。
      - 被拒绝时保持体面。
    reply_moves:
      - 接受或表达不方便。
      - 给台阶。
      - 必要时补替代方案。
    avoid:
      - 连续追问为什么
      - 用委屈或付出绑架对方
      - 被拒绝后自嘲过度
    timing:
      default_delay: 看到后自然回复
      reason: 简洁确认即可，拖延或连续追问都会增加压力。
    natural_examples:
      - 行，知道啦
      - 没事，那下次再说
      - 好，不勉强你
      - 可以，那先这样
      - 嗯，不急
      - 那换个时间也行

  flirting:
    label: 暧昧与试探
    risk_level: medium
    description: 有好感表达、玩笑式试探、轻度撩拨或关系升温信号。
    reply_goal: 接住好感并保留松弛感，根据关系阶段轻轻推进。
    classification_signals:
      - 对方夸你、开暧昧玩笑、表达想见、暗示在意。
      - 对话有升温空间，但还不一定适合强推进。
    principles:
      - 回应温度与对方接近。
      - 给一点信号但不强行定义关系。
      - 已确认关系可以更亲密，追求阶段要更留白。
    emotional_intelligence:
      - 接住好感，不让对方尴尬。
      - 不把普通玩笑理解成承诺。
      - 轻轻推进后给对方回旋空间。
    reply_moves:
      - 接住夸或玩笑。
      - 轻轻反抛一个信号。
      - 保留松弛感。
    avoid:
      - 突然表白或逼问关系
      - 油腻称呼和过度承诺
      - 一下子把氛围拉满
    timing:
      default_delay: 按自然节奏回复
      reason: 适度留白会更自然，但不必刻意冷着对方。
    natural_examples:
      - 你这话有点东西
      - 那我就当真了啊
      - 怎么突然这么会说
      - 哈哈这算夸我吗
      - 这句我爱听
      - 行，我先记下了

  cold_distance:
    label: 冷淡与疏离
    risk_level: high
    description: 回应明显变短、敷衍、回避话题，或对方在主动拉开距离。
    reply_goal: 降低追问压力，确认必要信息，然后给对方一点空间。
    classification_signals:
      - 对方只回嗯、哦、随便、再说，或明显不展开。
      - 对方可能忙、累、疏离或不想继续当前话题。
    principles:
      - 控制消息数量。
      - 只回应当前明确内容。
      - 给空间，不用追着要态度。
    emotional_intelligence:
      - 别把对方冷淡立刻归因成不在乎。
      - 用短句给空间，比连环追问更稳。
      - 如果必须确认事情，只问一个具体问题。
    reply_moves:
      - 简短确认。
      - 释放空间。
      - 必要时留下后续入口。
    avoid:
      - 连续补发和逼问态度
      - 用阴阳怪气试探在意程度
      - 把“你是不是不想理我”发出去
    timing:
      should_reply_now: false
      default_delay: 稍等一会儿再简短回复
      reason: 对方可能需要空间，紧追容易让疏离感更强。
    natural_examples:
      - 好，那你先忙
      - 行，晚点再说
      - 嗯，那先这样
      - 不急，你先弄
      - 那我先不打扰
      - 有空再说也行

  work_coordination:
    label: 工作协作
    risk_level: medium
    description: 围绕任务、进度、时间、责任、交付或会议进行沟通。
    reply_goal: 确认事实、责任和下一步，让信息可执行。
    classification_signals:
      - 出现进度、需求、会议、文件、项目、同步、截止、交付等工作信息。
      - 当前核心是效率、责任、时间和交付。
    principles:
      - 说清状态和时间点。
      - 有风险就提前说明。
      - 不混入不必要的私人情绪。
    emotional_intelligence:
      - 对方着急时，优先给确定信息。
      - 有问题就客观描述限制。
      - 不把协作问题变成人际攻击。
    reply_moves:
      - 确认收到。
      - 给状态和节点。
      - 提风险或问缺口。
    avoid:
      - 模糊承诺
      - 混入不必要的私人情绪
      - 把责任说得不清楚
    timing:
      default_delay: 工作时间内尽快回复
      reason: 协作信息通常影响他人安排，及时确认更高效。
    natural_examples:
      - 收到，我下午给你
      - 这个时间我赶不上
      - 我先确认下进度
      - 好，我同步一下
      - 我看下再回你
      - 这块我再对一下

  boundary:
    label: 边界表达
    risk_level: high
    description: 对方或用户在表达不舒服、需要空间、拒绝被追问或设定行为界限。
    reply_goal: 确认并尊重边界，同时简洁表达自己的必要立场。
    classification_signals:
      - 出现别再问、别这样、需要空间、不想说、尊重我等边界信号。
      - 对方核心需求是停止某个行为，而不是继续解释。
    principles:
      - 不争论对方有没有资格设边界。
      - 用具体行为回应边界。
      - 简短确认后停止追问。
    emotional_intelligence:
      - 尊重边界要落到动作，不只说漂亮话。
      - 不把对方边界理解成攻击。
      - 自己设边界时，也给对方清楚范围。
    reply_moves:
      - 确认听见。
      - 说明会停止某个行为。
      - 必要时留下以后再聊的入口。
    avoid:
      - 把尊重边界说成冷漠
      - 继续追问隐私或关系承诺
      - 用“我只是关心你”抵消边界
    timing:
      default_delay: 简短确认后停止追问
      reason: 边界被表达后，及时确认并用行动留出空间最重要。
    natural_examples:
      - 好，我不问了
      - 知道了，给你点空间
      - 行，我尊重你的意思
      - 那我先不打扰
      - 嗯，我先停一下
      - 好，这个我注意

  unknown:
    label: 场景不明确
    risk_level: unknown
    description: 截图信息不足或存在多个同等可能的场景。
    reply_goal: 只回应明确内容，用轻量问题补充信息。
    classification_signals:
      - 截图缺少上下文。
      - 文字太短，无法判断对方真实意图。
      - 多个场景都有可能，但证据不足。
    principles:
      - 不猜测对方动机。
      - 保持回复可进可退。
      - 用一个轻问题补信息。
    emotional_intelligence:
      - 不要根据少量信息做关系定性。
      - 不要突然道歉、表白或承诺。
      - 先把对方意思问清楚。
    reply_moves:
      - 轻确认。
      - 问具体一点。
      - 暂时不表达强立场。
    avoid:
      - 根据少量信息做关系定性
      - 过度承诺或过度道歉
      - 脑补对方真实动机
    timing:
      default_delay: 按平时节奏回复
      reason: 信息不足时先自然回应，不需要制造额外紧张。
    natural_examples:
      - 啊，怎么啦
      - 我没太懂这句
      - 你是说哪个
      - 等等，我捋一下
      - 哪个意思
      - 你展开说说
