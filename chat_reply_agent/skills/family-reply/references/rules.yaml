relation_type: family
name: 家人
stage: 家人沟通
reply_objective: 让对方安心，同时把自己的安排、态度或边界说清楚。

context_radar:
  low_risk:
    - 对方只是日常关心或提醒，回复要让人放心，不要嫌烦。
    - 对方问吃饭、回家、身体、钱等日常事，给明确状态即可。
  medium_risk:
    - 对方催促或唠叨时，先应一声，再说明安排。
    - 对方担心你时，不要只回“没事”，要补一点具体信息。
  high_risk:
    - 对方生气、翻旧账或强势干预时，先降温，不顶撞。
    - 需要设边界时，说具体行为，不攻击对方动机。

principles:
  - 先回应关心或担心，再说明自己的安排。
  - 家人沟通里，安抚比讲理更容易先起作用。
  - 有边界也尽量说得软一点，但意思要清楚。
  - 不把每次提醒都理解成控制。
  - 不用冷处理换清净。

emotional_intelligence:
  - 对方担心时，给具体状态，比如“我到家了/吃过了/晚点回”。
  - 对方唠叨时，先接一句“我知道啦”，再说自己的安排。
  - 对方强势时，先降火，再表达边界。
  - 对方帮忙或付出时，记得回应，不只说事情本身。
  - 家人的高情商是让对方安心，同时不把自己憋住。

response_moves:
  - 安心：给一个具体状态。
  - 软边界：用“我知道，但这事我想自己来”。
  - 延后沟通：先安抚，再约晚点说。
  - 承接关心：承认对方是担心你。
  - 轻转移：气氛太硬时，用一句生活化的话收住。

tone_guidance:
  - 温和、接地气。
  - 像家里人说话，不像写保证书。
  - 可以软一点，但不要委屈兮兮。
  - 不要太书面，不要太冷。

daily_voice:
  - 可以用“好啦”“知道啦”“别担心”“我心里有数”。
  - 解释一句就够，不要写成检讨。
  - 语气软，但意思要清楚。
  - 多给具体状态，少讲抽象道理。

wording_rules:
  - 优先 8-28 个中文字符。
  - 可以带一点撒娇式缓和，但不要敷衍。
  - 少用“你总是/你每次/你根本”。
  - 不要把边界写成宣战。

boundaries:
  - 不用顶撞争输赢。
  - 不因为怕麻烦就完全不回。
  - 不把家人的关心都理解成控制。
  - 不接受过度干涉时，也只说当前这件事。

avoid:
  - 顶撞式回复
  - 只讲结论不讲状态
  - 用沉默制造距离
  - 翻旧账
  - 冷冰冰地说“你别管”

bad_to_better:
  - bad: 你别管了，我自己的事自己知道。
    better: 我知道啦，这事我自己来。
  - bad: 我已经成年了，不需要你一直提醒。
    better: 好啦，我会注意的。
  - bad: 你的担心我理解，但我希望你尊重我的边界。
    better: 别担心，这个我心里有数。

timing:
  default_delay: 可以稍后但不要拖太久
  reason: 家人沟通可以留一点缓冲，但长期不回容易加重担心。

reply_styles:
  - 温和说明
  - 安抚确认
  - 轻轻设边界

natural_examples:
  - 好啦，我知道
  - 别担心，我晚点说
  - 嗯嗯，我会注意
  - 我不是不听你说
  - 这个我心里有数
  - 先别急嘛
  - 我吃过啦
  - 到了我跟你说
  - 好，我晚点回你
  - 这事我自己来
  - 我知道你是担心我
  - 先别生气嘛
  - 嗯，我记着呢
  - 晚点跟你细说
  - 放心，没事的
