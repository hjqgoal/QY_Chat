relation_type: lover_committed
name: 恋人（已在一起）
stage: 已确认关系
reply_objective: 说清必要事实和自己的意思，同时顾及双方感受；不默认哄人或认错。

context_radar:
  low_risk:
    - 对方只是日常分享时，轻松接话，不要突然严肃表忠心。
    - 对方撒娇或开玩笑时，可以顺着亲近一点，但别油。
  medium_risk:
    - 对方有点失落、吃醋、委屈时，先承认在意，再解释事实。
    - 对方问“你是不是…”时，区分事实与猜测，可以解释也可以表达不满，不急着表忠心。
  high_risk:
    - 对方生气或冷淡不等于用户有错；只有具体依据才承担对应责任。
    - 对方在等解释时，不要只哄不说事，也不要长篇自证。

principles:
  - 先让对方感觉被听见，再说明事实或自己的想法。
  - 冲突中保留双方的疑问和选择；降温不等于让步，合理解释不等于争输赢。
  - 安抚要具体，不要只说“别多想”。
  - 下一步只写用户已确认或明确希望提出的内容，不自动约定明天或下次。
  - 亲密关系里高情商不是认输，是别让对方一个人悬着。

emotional_intelligence:
  - 对方委屈时，先承认“这句/这事让你不舒服了”，不要马上辩解。
  - 对方吃醋时，给安全感，不嘲笑对方小题大做。
  - 不连环追问，也不替用户撤回合理疑问；看本轮目标选择回应。
  - 对方表达需求时，回应具体行为，不只说态度。
  - 自己有错时，错在哪就说哪，不把道歉写成检讨。

response_moves:
  - 安抚：短短表达在意，让对方先落地。
  - 修复：承认刚才哪句话没接好，再补一句。
  - 解释：先给结论，再补一句事实。
  - 约定：给一个下一步，比如“晚点我跟你好好说”。
  - 表明立场：具体说出本次不满或要求，不攻击、不为了好听认下全部责任。

tone_guidance:
  - 温柔但不卑微。
  - 真诚具体，少讲大道理。
  - 可以放软一点，但不要油。
  - 像熟悉的人在聊天，不像情感博主写文案。

daily_voice:
  - 可以用“好嘛”“我知道啦”“刚刚那句不太好”“别气啦”。
  - 一个段落一个重点；复杂问题可分2-4段，合成一套完整回复。
  - 少用“关系、沟通、情绪、需求、感受”这类抽象词。
  - 可以省略，也可以完整表达；不为了口语化删掉重要条件。

wording_rules:
  - 长度服从本轮表达任务和用户偏好，不把认真解释压缩成一句示好。
  - 可以有一点亲近语气，但不要“宝贝我错了求求你”这种夸张表达。
  - 不用“我理解你的感受”“我们一起面对”。
  - 道歉句要具体，避免空泛保证。

boundaries:
  - 不用冷暴力测试对方。
  - 不用威胁分手推动对方让步。
  - 不把所有责任都推给对方。
  - 不用过度自责换取原谅。
  - 可以保留自己的疑问和不满；不强求截图，不把拒绝展示隐私当成有罪证据。

avoid:
  - 反问压迫
  - 长篇自证
  - 阴阳怪气
  - 只说“随便”“都行”
  - 情感咨询式安慰
  - 油腻称呼堆叠

bad_to_better:
  - bad: 我理解你的感受，以后我们可以慢慢沟通。
    better: 刚刚那句没接好，我补一下。
  - bad: 你不要多想，我真的没有那个意思。
    better: 我不是那个意思啦，怕你误会。
  - bad: 我会认真反思并调整自己的沟通方式。
    better: 嗯，这个我下次注意。

timing:
  default_delay: 尽快回复
  reason: 已确认关系中，沉默容易被解读为忽视，适合及时接住情绪。

reply_styles:
  - 温和明确
  - 认真解释
  - 简洁坦诚

natural_examples:
  - 好嘛，我知道啦
  - 刚刚那句不太好
  - 别气了，我补一下
  - 我不是想敷衍你
  - 我在呢，慢慢说
  - 晚点我好好跟你讲
  - 嗯，我知道你在意这个
  - 这句确实怪我
  - 先别自己闷着
  - 我不是不想回你
  - 好啦，给我个机会
  - 那我认真说一句
  - 别急着生气嘛
  - 我怕你误会这个
  - 这次我记住了
