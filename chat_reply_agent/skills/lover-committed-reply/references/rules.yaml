relation_type: lover_committed
name: 恋人（已在一起）
stage: 已确认关系
reply_objective: 稳住亲密感，把当前情绪或误会接住，让对方觉得你在意且愿意处理。

context_radar:
  low_risk:
    - 对方只是日常分享时，轻松接话，不要突然严肃表忠心。
    - 对方撒娇或开玩笑时，可以顺着亲近一点，但别油。
  medium_risk:
    - 对方有点失落、吃醋、委屈时，先承认在意，再解释事实。
    - 对方问“你是不是…”时，不要反问压回去，先给安全感。
  high_risk:
    - 对方明显生气、冷淡、说“算了”时，先降温和承担一小部分可承担的责任。
    - 对方在等解释时，不要只哄不说事，也不要长篇自证。

principles:
  - 先让对方感觉被听见，再说明事实或自己的想法。
  - 冲突里先修复连接，再讨论谁对谁错。
  - 安抚要具体，不要只说“别多想”。
  - 能给下一步就给下一步，比如晚点解释、现在补一句、下次注意。
  - 亲密关系里高情商不是认输，是别让对方一个人悬着。

emotional_intelligence:
  - 对方委屈时，先承认“这句/这事让你不舒服了”，不要马上辩解。
  - 对方吃醋时，给安全感，不嘲笑对方小题大做。
  - 对方冷淡时，别连环追问，用一句短短的在意加空间。
  - 对方表达需求时，回应具体行为，不只说态度。
  - 自己有错时，错在哪就说哪，不把道歉写成检讨。

response_moves:
  - 安抚：短短表达在意，让对方先落地。
  - 修复：承认刚才哪句话没接好，再补一句。
  - 解释：先给结论，再补一句事实。
  - 约定：给一个下一步，比如“晚点我跟你好好说”。
  - 放软：用“好嘛/啦/我知道”降低对抗。

tone_guidance:
  - 温柔但不卑微。
  - 真诚具体，少讲大道理。
  - 可以放软一点，但不要油。
  - 像熟悉的人在聊天，不像情感博主写文案。

daily_voice:
  - 可以用“好嘛”“我知道啦”“刚刚那句不太好”“别气啦”。
  - 一条消息里只说一个重点。
  - 少用“关系、沟通、情绪、需求、感受”这类抽象词。
  - 不要把每句都写成完整主谓宾。

wording_rules:
  - 优先 8-30 个中文字符。
  - 可以有一点亲近语气，但不要“宝贝我错了求求你”这种夸张表达。
  - 不用“我理解你的感受”“我们一起面对”。
  - 道歉句要具体，避免空泛保证。

boundaries:
  - 不用冷暴力测试对方。
  - 不用威胁分手推动对方让步。
  - 不把所有责任都推给对方。
  - 不用过度自责换取原谅。

avoid:
  - 反问压迫
  - 长篇自证
  - 阴阳怪气
  - 只说“随便”“都行”
  - 情感咨询式安慰
  - 油腻称呼堆叠

bad_to_better:
  - bad: 我理解你的感受，以后我们可以慢慢沟通。
    better: 刚刚那句没接好，我补一下。
  - bad: 你不要多想，我真的没有那个意思。
    better: 我不是那个意思啦，怕你误会。
  - bad: 我会认真反思并调整自己的沟通方式。
    better: 嗯，这个我下次注意。

timing:
  default_delay: 尽快回复
  reason: 已确认关系中，沉默容易被解读为忽视，适合及时接住情绪。

reply_styles:
  - 放软一点
  - 认真解释
  - 轻松哄一下

natural_examples:
  - 好嘛，我知道啦
  - 刚刚那句不太好
  - 别气了，我补一下
  - 我不是想敷衍你
  - 我在呢，慢慢说
  - 晚点我好好跟你讲
  - 嗯，我知道你在意这个
  - 这句确实怪我
  - 先别自己闷着
  - 我不是不想回你
  - 好啦，给我个机会
  - 那我认真说一句
  - 别急着生气嘛
  - 我怕你误会这个
  - 这次我记住了
