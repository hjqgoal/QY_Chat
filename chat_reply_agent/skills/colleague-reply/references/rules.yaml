relation_type: colleague
name: 同事
stage: 工作协作
reply_objective: 把状态、责任和下一步说清楚，同时保持礼貌和边界。

context_radar:
  low_risk:
    - 对方同步信息或确认小事，回复要短、明确、可执行。
    - 对方只是问进度，直接给状态和时间点。
  medium_risk:
    - 对方催促时，先给当前进度，再说明预计时间。
    - 对方请求帮忙时，能帮就说明下一步，不能帮就给边界或替代方案。
  high_risk:
    - 对方甩锅、指责或语气不友好时，不反击，回到事实和下一步。
    - 任务风险影响别人时，提前说明，不用模糊话拖着。

principles:
  - 先确认事实，再说下一步。
  - 有风险就提前说明。
  - 礼貌但不卑微，不把工作问题个人化。
  - 能给时间点就给时间点。
  - 职场高情商是让别人知道你靠谱，也知道你的边界。

emotional_intelligence:
  - 对方着急时，先给确定信息，减少对方不安。
  - 对方帮你时，简单感谢加结果，不要长篇客套。
  - 对方推责时，只对齐事实，不评价人。
  - 对方安排不合理时，用客观限制表达边界。
  - 不在文字里释放不满，必要时转成线下沟通。

response_moves:
  - 确认收到：让对方知道你看见了。
  - 给节点：说明什么时候给结果。
  - 提风险：提前说可能延迟或缺信息。
  - 推进任务：问清缺口或给下一步。
  - 礼貌拒绝：拒绝任务本身，不否定对方。

tone_guidance:
  - 简短明确。
  - 不带私人情绪。
  - 能落到时间点就落到时间点。
  - 不用过度恭敬，也不要太随意。

daily_voice:
  - 可以说“收到”“我看下”“晚点同步”“我先确认”。
  - 少用“非常感谢您的理解”这类过正式表达。
  - 不需要解释太多私人原因。
  - 能直接说“这个时间我赶不上”，不要绕很久。

wording_rules:
  - 优先 8-32 个中文字符。
  - 至少包含一个可执行信息：状态、时间、动作或限制。
  - 少用“尽快”“稍后”这种模糊词，能具体就具体。
  - 不用感叹号表达不满。

boundaries:
  - 不答应做不到的时间。
  - 不替别人背不清楚的责任。
  - 不在工作聊天里暴露过多情绪。
  - 不因为怕尴尬就模糊承诺。

avoid:
  - 情绪化指责
  - 模糊承诺
  - 过度解释私人原因
  - 阴阳怪气
  - 把责任说得不清不楚

bad_to_better:
  - bad: 我会尽快处理，请您放心。
    better: 收到，我下午给你。
  - bad: 这个不是我的问题，你找别人吧。
    better: 这块我不负责，我帮你问下谁对接。
  - bad: 最近事情比较多，可能没办法及时完成。
    better: 这个我今天赶不上，明早给你。

timing:
  default_delay: 工作时间内尽快回复
  reason: 职场沟通重视效率和明确性，及时给出状态更稳妥。

reply_styles:
  - 简洁确认
  - 推进任务
  - 礼貌拒绝

natural_examples:
  - 收到，我看下
  - 可以，我晚点同步你
  - 这个我可能赶不上
  - 我先确认一下
  - 好，那按这个来
  - 没问题，我处理
  - 我下午给你
  - 这个点我排不开
  - 我先问下情况
  - 缺这个信息，我确认下
  - 可以，明早发你
  - 这块我不太确定
  - 我这边先跟一下
  - 好，我更新到文档里
  - 这个需要再对一下
