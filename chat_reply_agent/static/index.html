<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>奇遇聊天助手</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #1f2937;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        width: min(960px, calc(100% - 32px));
        margin: 32px auto;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
      }

      .subtitle {
        margin: 0 0 24px;
        color: #667085;
      }

      .page-link {
        display: inline-block;
        color: #175cd3;
        text-decoration: none;
        font-weight: 600;
      }

      .page-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        margin-bottom: 14px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
        border: 1px solid #e5e7eb;
        border-radius: 999px;
        padding: 6px 12px;
        background: #fff;
        color: #667085;
        font-size: 14px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #98a2b3;
      }

      .status.ready .status-dot {
        background: #12b76a;
      }

      .panel {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 20px;
      }

      form {
        display: grid;
        gap: 16px;
        min-width: 0;
      }

      label {
        display: grid;
        gap: 8px;
        min-width: 0;
        font-weight: 600;
      }

      input,
      select,
      textarea,
      button {
        font: inherit;
      }

      input[type="text"],
      input[type="file"],
      select {
        width: 100%;
        min-width: 0;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        padding: 10px 12px;
        background: #fff;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 12px 16px;
        background: #2563eb;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        background: #98a2b3;
        cursor: wait;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        min-width: 0;
      }

      .reply-controls {
        min-width: 0;
        margin: 0;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        padding: 14px;
      }

      .reply-controls legend {
        padding: 0 6px;
        font-weight: 700;
      }

      .control-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 12px;
        min-width: 0;
      }

      .persistence-option {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-top: 14px;
        border-top: 1px solid #eef2f7;
        padding-top: 14px;
        cursor: pointer;
      }

      .persistence-option input {
        width: 18px;
        height: 18px;
        margin: 2px 0 0;
        flex: 0 0 auto;
      }

      .persistence-copy {
        display: grid;
        gap: 3px;
      }

      .persistence-copy small {
        color: #667085;
        font-weight: 400;
      }

      .privacy-note {
        border-color: #b2ddff;
        background: #eff8ff;
        color: #175cd3;
      }

      .upload-field {
        display: grid;
        gap: 8px;
        min-width: 0;
      }

      .background-field {
        display: grid;
        gap: 8px;
        min-width: 0;
      }

      .background-field textarea {
        width: 100%;
        min-height: 116px;
        resize: vertical;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        padding: 10px 12px;
        background: #fff;
        line-height: 1.6;
      }

      .background-meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: #667085;
        font-size: 13px;
        font-weight: 400;
      }

      .background-meta span:last-child {
        flex: 0 0 auto;
      }

      .background-evidence {
        margin: 0;
        border-left: 3px solid #84adff;
        padding: 8px 0 8px 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.65;
      }

      .upload-label {
        font-weight: 700;
      }

      .upload-help,
      .upload-status {
        margin: 0;
        color: #667085;
        font-size: 13px;
      }

      .upload-status.warning {
        color: #b54708;
      }

      .upload-list {
        display: grid;
        gap: 8px;
      }

      .upload-list:empty {
        display: none;
      }

      .upload-item {
        display: grid;
        grid-template-columns: 28px 56px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        min-width: 0;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 8px 10px;
        background: #f9fafb;
      }

      .upload-order {
        color: #475467;
        font-size: 13px;
        font-weight: 700;
        text-align: center;
      }

      .upload-thumbnail {
        width: 56px;
        height: 56px;
        border: 1px solid #d0d5dd;
        border-radius: 6px;
        object-fit: contain;
        background: #fff;
      }

      .upload-details {
        min-width: 0;
      }

      .upload-name {
        overflow-wrap: anywhere;
        font-weight: 600;
      }

      .upload-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
      }

      .upload-action {
        border: 1px solid #d0d5dd;
        padding: 6px 9px;
        background: #fff;
        color: #344054;
        font-size: 13px;
        font-weight: 600;
      }

      .upload-action.remove {
        color: #b42318;
      }

      .upload-action:disabled {
        border-color: #e5e7eb;
        background: #f2f4f7;
        color: #98a2b3;
        cursor: not-allowed;
      }

      .regenerate-candidate {
        border-color: #84adff;
        color: #175cd3;
      }

      .result {
        display: grid;
        gap: 16px;
        margin-top: 20px;
      }

      .card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 16px;
      }

      .card h2,
      .card h3 {
        margin: 0 0 10px;
      }

      pre {
        white-space: pre-wrap;
        word-break: break-word;
        margin: 0;
        color: #344054;
      }

      .reply {
        border-top: 1px solid #eef2f7;
        padding-top: 12px;
        margin-top: 12px;
      }

      .reply textarea {
        width: 100%;
        min-height: 54px;
        box-sizing: border-box;
        resize: vertical;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        padding: 8px 10px;
        background: #fff;
        font: inherit;
      }

      .feedback-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .feedback-button {
        border: 1px solid #d0d5dd;
        padding: 6px 10px;
        background: #fff;
        color: #344054;
        font-size: 13px;
        font-weight: 600;
      }

      .feedback-button.accepted {
        border-color: #12b76a;
        color: #027a48;
      }

      .feedback-status {
        margin-top: 8px;
        min-height: 18px;
      }

      .memory-source-list {
        display: grid;
        gap: 0;
      }

      .memory-source {
        padding: 12px 0;
        border-top: 1px solid #eef2f7;
      }

      .memory-source:first-child {
        padding-top: 0;
        border-top: 0;
      }

      .memory-source:last-child {
        padding-bottom: 0;
      }

      .memory-source-heading {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 5px;
      }

      .memory-score {
        display: inline-flex;
        border-radius: 999px;
        padding: 2px 7px;
        background: #ecfdf3;
        color: #027a48;
        font-size: 12px;
        font-weight: 700;
      }

      .message-list {
        display: grid;
        gap: 10px;
      }

      .message {
        border: 1px solid #eef2f7;
        border-radius: 8px;
        padding: 10px 12px;
        background: #f9fafb;
      }

      .message.me {
        background: #eff6ff;
      }

      .message.other {
        background: #f7fee7;
      }

      .message.needs-review {
        border-color: #f79009;
        background: #fffaeb;
      }

      .message-speaker {
        margin-bottom: 4px;
        color: #667085;
        font-size: 13px;
        font-weight: 700;
      }

      .message-confidence {
        display: inline-flex;
        margin-left: 8px;
        border: 1px solid #d0d5dd;
        border-radius: 999px;
        padding: 2px 7px;
        background: #fff;
        color: #475467;
        font-size: 12px;
        font-weight: 600;
      }

      .message-confidence.warning {
        border-color: #fedf89;
        background: #fffaeb;
        color: #b54708;
      }

      .review-banner {
        margin: 12px 0;
        border: 1px solid #b2ddff;
        border-radius: 8px;
        padding: 10px 12px;
        background: #eff8ff;
        color: #175cd3;
      }

      .review-banner.warning {
        border-color: #fedf89;
        background: #fffaeb;
        color: #b54708;
      }

      .message-warnings {
        margin: 0;
        padding-left: 18px;
        color: #b54708;
        font-size: 13px;
      }

      .review-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      .message-edit {
        display: grid;
        gap: 8px;
      }

      .message-controls {
        display: grid;
        grid-template-columns: 140px 140px 1fr;
        gap: 8px;
        align-items: center;
      }

      .message textarea {
        width: 100%;
        min-height: 48px;
        box-sizing: border-box;
        resize: vertical;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        padding: 8px 10px;
        background: #fff;
        font: inherit;
      }

      .secondary-button {
        background: #111827;
      }

      .meta {
        color: #667085;
        font-size: 14px;
      }

      .style-evidence-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0;
      }

      .style-evidence-phrase {
        border: 1px solid #d0d5dd;
        border-radius: 6px;
        padding: 5px 8px;
        background: #f9fafb;
        color: #344054;
        font-size: 13px;
      }

      .style-evidence-note {
        border-left: 3px solid #84adff;
        padding-left: 10px;
      }

      .scenario-heading {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .scenario-badge {
        display: inline-flex;
        align-items: center;
        border: 1px solid #b2ddff;
        border-radius: 999px;
        padding: 4px 9px;
        background: #eff8ff;
        color: #175cd3;
        font-size: 13px;
        font-weight: 700;
      }

      .signal-list {
        margin: 8px 0 0;
        padding-left: 20px;
        color: #475467;
      }

      .quality-badge {
        display: inline-flex;
        align-items: center;
        margin-left: 8px;
        border: 1px solid #d0d5dd;
        border-radius: 999px;
        padding: 3px 8px;
        background: #f9fafb;
        color: #475467;
        font-size: 12px;
        font-weight: 700;
        vertical-align: middle;
      }

      .quality-badge.passed {
        border-color: #abefc6;
        background: #ecfdf3;
        color: #067647;
      }

      .quality-badge.failed {
        border-color: #fedf89;
        background: #fffaeb;
        color: #b54708;
      }

      .quality-grades {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
        margin: 16px 0;
        font-size: 14px;
      }

      .quality-grades dt { color: #475467; }
      .quality-grades dd { margin: 4px 0 0; font-weight: 600; }
      [data-quality-details], [data-quality-recommendation] { overflow-wrap: anywhere; }

      .error {
        color: #b42318;
        background: #fff3f0;
        border-color: #fecdca;
      }

      @media (max-width: 720px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .message-controls {
          grid-template-columns: 1fr;
        }

        .control-grid {
          grid-template-columns: 1fr;
        }

        .upload-item {
          grid-template-columns: 24px 48px minmax(0, 1fr);
        }

        .upload-thumbnail {
          width: 48px;
          height: 48px;
        }

        .upload-actions {
          grid-column: 2 / -1;
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>奇遇聊天助手</h1>
      <p class="subtitle">上传聊天截图或补充文字背景，生成回复时机、策略和候选回复。</p>
      <nav class="page-links" aria-label="辅助页面">
        <a class="page-link" href="/memory">管理记忆与风格</a>
        <a class="page-link" href="/evals">打开回复质量评测</a>
      </nav>
      <div id="status" class="status">
        <span class="status-dot"></span>
        <span>正在检查模型配置...</span>
      </div>
      <p id="retrieval-status" class="meta" role="status"></p>

      <section class="panel">
        <form id="reply-form">
          <div class="grid">
            <label>
              关系类型
              <select name="relation_type" required>
                <option value="lover_committed">恋人（已在一起）</option>
                <option value="lover_pursuing">追求/暧昧中</option>
                <option value="colleague">同事</option>
                <option value="family">家人</option>
                <option value="friend">朋友</option>
              </select>
            </label>

            <label>
              我的账号 ID
              <input name="user_id" type="text" value="default" />
            </label>
          </div>

          <div class="grid">
            <label>
              聊天对象 ID
              <input name="contact_id" type="text" value="default-contact" list="contact-options" required />
              <datalist id="contact-options"></datalist>
            </label>

            <label>
              对方备注
              <input name="contact_name" type="text" placeholder="例如：小林" />
            </label>
          </div>

          <fieldset class="reply-controls">
            <legend>本次回复设定</legend>
            <div class="grid">
              <label>
                我想怎么回
                <select name="reply_intent">
                  <option value="auto">让系统判断</option>
                  <option value="agree">答应 / 接受</option>
                  <option value="decline">拒绝 / 婉拒</option>
                  <option value="comfort">安慰对方</option>
                  <option value="explain">解释清楚</option>
                  <option value="advance">主动推进</option>
                  <option value="cool_down">先降温</option>
                  <option value="end_topic">结束话题</option>
                  <option value="ask_clarify">问清楚</option>
                </select>
              </label>

              <label>
                补充意图
                <input name="custom_intent" type="text" maxlength="160" placeholder="例如：拒绝，但给对方留个台阶" />
              </label>
            </div>

            <div class="control-grid">
              <label>
                回复长度
                <select name="length_preference">
                  <option value="very_short">很短</option>
                  <option value="short" selected>短句</option>
                  <option value="normal">稍完整</option>
                </select>
              </label>

              <label>
                亲密程度
                <select name="intimacy_level">
                  <option value="1">克制</option>
                  <option value="2" selected>自然</option>
                  <option value="3">更亲近</option>
                </select>
              </label>

              <label>
                主动程度
                <select name="initiative_level">
                  <option value="1">只回应</option>
                  <option value="2" selected>自然接话</option>
                  <option value="3">主动推进</option>
                </select>
              </label>
            </div>

            <label class="persistence-option">
              <input name="save_to_memory" type="checkbox" checked />
              <span class="persistence-copy">
                <span>保存本轮到联系人记忆</span>
                <small>取消后不会写入本机数据库，上传图片会在识别后删除；补充背景和识别结果仍会发送给你配置的大模型服务。</small>
              </span>
            </label>
          </fieldset>

          <label class="background-field" for="background-context">
            补充聊天背景（可单独使用）
            <textarea
              id="background-context"
              name="background_context"
              maxlength="2000"
              placeholder="例如：我们昨天因为见面时间吵了几句，今天对方主动来找我。我想缓和一下，但不想显得太刻意。"
            ></textarea>
            <span class="background-meta">
              <span>可概括更早的聊天、关系进展和当前顾虑；有截图时会一起参考。</span>
              <span id="background-count">0 / 2000</span>
            </span>
          </label>

          <div class="upload-field">
            <label class="upload-label" for="chat-images">微信聊天截图（选填，1–6 张）</label>
            <input id="chat-images" name="images" type="file" accept="image/*" multiple />
            <p class="upload-help">多张截图会按下方顺序识别，请将较早的聊天放在前面。</p>
            <div id="upload-list" class="upload-list" aria-live="polite"></div>
            <p id="upload-status" class="upload-status">尚未选择截图</p>
          </div>

          <button id="submit-button" type="submit">开始分析</button>
        </form>
      </section>

      <section id="result" class="result"></section>
    </main>

    <script>
      const form = document.querySelector("#reply-form");
      const button = document.querySelector("#submit-button");
      const result = document.querySelector("#result");
      const statusBox = document.querySelector("#status");
      const imageInput = document.querySelector("#chat-images");
      const backgroundInput = document.querySelector("#background-context");
      const backgroundCount = document.querySelector("#background-count");
      const uploadList = document.querySelector("#upload-list");
      const uploadStatus = document.querySelector("#upload-status");
      const maxScreenshotCount = 6;
      let latestResponse = null;
      let memoryPollToken = 0;
      let qualityPollToken = 0;
      let replyRequestToken = 0;
      let pendingExtraction = null;
      let contextNeedsRegeneration = false;
      let knownContacts = [];
      let selectedImages = [];
      let previewUrls = [];

      loadStatus();
      loadContacts();
      updateSubmitButtonLabel();

      backgroundInput.addEventListener("input", () => {
        backgroundCount.textContent = `${backgroundInput.value.length} / 2000`;
        invalidateTopic();
        updateSubmitButtonLabel();
      });

      result.addEventListener("input", (event) => {
        if (event.target.matches("[data-field='text']")) {
          invalidateTopic();
          syncEditedMessage(event.target.closest("[data-message-index]"));
          return;
        }
        if (!latestResponse || !event.target.matches("[data-reply-text]")) return;
        const card = event.target.closest("[data-reply-index]");
        const index = Number(card.dataset.replyIndex);
        latestResponse.quality_edited_indexes = [...new Set([...(latestResponse.quality_edited_indexes || []), index])];
        updateSingleQuality({candidate_index: index, overall_score: null, assessment_source: "local", verdict: "unverified", status: "not_reviewed", passed: false, issues: ["手动编辑后需重新质检"]}, index);
        const badge = card.querySelector(".quality-badge");
        if (badge) {
          badge.textContent = "已编辑，待确认";
          badge.classList.remove("passed");
          badge.classList.add("failed");
        }
        const total = result.querySelector("[data-quality-total]");
        if (total) {
          total.textContent = "待确认";
          total.classList.remove("passed");
          total.classList.add("failed");
        }
        const state = result.querySelector("[data-quality-state]");
        if (state) state.textContent = "编辑后的内容尚未质检";
        const summary = result.querySelector("[data-quality-summary]");
        if (summary) summary.textContent = latestResponse.quality.summary;
        const details = card.querySelector("[data-quality-details]");
        if (details) details.textContent = "已编辑，之前的评价依据不再适用。";
        const group = result.querySelector("[data-quality-group]");
        if (group) group.textContent = "候选已变动，组内差异需重新确认。";
        const recommendation = result.querySelector("[data-quality-recommendation]");
        if (recommendation) recommendation.textContent = "";
        refreshQualityRevisions(latestResponse);
      });

      form.elements.user_id.addEventListener("change", loadContacts);
      form.addEventListener("change", (event) => {
        if (event.target.matches('[name="user_id"], [name="contact_id"], [name="relation_type"], [name="reply_intent"], [name="custom_intent"], [name="length_preference"], [name="intimacy_level"], [name="initiative_level"]')) {
          if (latestResponse) contextNeedsRegeneration = true;
          stopQualityPolling(latestResponse, "聊天对象、关系或回复要求已修改，请重新生成；旧评估不再适用。");
        }
      });
      form.elements.contact_id.addEventListener("change", () => {
        const contact = knownContacts.find(
          (item) => item.contact_id === form.elements.contact_id.value.trim(),
        );
        if (contact) {
          form.elements.contact_name.value = contact.contact_name;
          form.elements.relation_type.value = contact.relation_type;
        }
      });

      imageInput.addEventListener("change", () => {
        const files = Array.from(imageInput.files || []);
        selectedImages = files.slice(0, maxScreenshotCount);
        renderSelectedImages(
          files.length > maxScreenshotCount
            ? `一次最多识别 ${maxScreenshotCount} 张，已保留前 ${maxScreenshotCount} 张。`
            : "",
        );
      });

      uploadList.addEventListener("click", (event) => {
        const actionButton = event.target.closest("[data-upload-action]");
        if (!actionButton) return;

        const index = Number(actionButton.dataset.imageIndex);
        const action = actionButton.dataset.uploadAction;
        if (!Number.isInteger(index) || index < 0 || index >= selectedImages.length) {
          return;
        }

        if (action === "remove") {
          selectedImages.splice(index, 1);
        } else if (action === "up" && index > 0) {
          [selectedImages[index - 1], selectedImages[index]] = [
            selectedImages[index],
            selectedImages[index - 1],
          ];
        } else if (action === "down" && index < selectedImages.length - 1) {
          [selectedImages[index], selectedImages[index + 1]] = [
            selectedImages[index + 1],
            selectedImages[index],
          ];
        }
        renderSelectedImages();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const backgroundContext = getBackgroundContext();
        if (!selectedImages.length && !backgroundContext) {
          result.innerHTML = '<div class="card error">请上传聊天截图，或填写补充聊天背景。</div>';
          backgroundInput.focus();
          return;
        }
        button.disabled = true;
        const requestToken = beginReplyRequest();
        latestResponse = null;
        button.textContent = selectedImages.length ? "识别中..." : "生成中...";
        result.innerHTML = "";

        try {
          if (!selectedImages.length) {
            const payload = buildChatPayload(
              createBackgroundOnlyChat(),
              form.elements.relation_type.value,
              form.elements.contact_id.value,
              form.elements.contact_name.value,
            );
            const response = await fetch("/api/reply/from-chat", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            if (!response.ok) {
              throw new Error(await readError(response));
            }
            const data = await response.json();
            if (requestToken === replyRequestToken) renderResult(data);
            else discardQualityJob(data.quality_job_id, data.user_id);
            return;
          }

          const uploadData = new FormData();
          selectedImages.forEach((file) => uploadData.append("images", file, file.name));
          const response = await fetch("/api/vision/extract-batch", {
            method: "POST",
            body: uploadData,
          });

          if (!response.ok) {
            throw new Error(await readError(response));
          }

          const data = await response.json();
          if (requestToken === replyRequestToken) renderExtractionReview(data);
        } catch (error) {
          if (requestToken === replyRequestToken) result.innerHTML = `<div class="card error">请求失败：${escapeHtml(error.message)}</div>`;
        } finally {
          if (requestToken === replyRequestToken) {
            button.disabled = false;
            updateSubmitButtonLabel();
          }
        }
      });

      result.addEventListener("click", async (event) => {
        if (event.target.matches("[data-action='use-revision']")) {
          useQualityRevision(event.target);
          return;
        }
        if (event.target.matches("[data-action='review-current']")) {
          await reviewCurrentReplies(event.target);
          return;
        }
        if (event.target.matches("[data-action='cancel-quality']")) {
          stopQualityPolling(latestResponse, "评估已取消，当前回复保持不变。");
          return;
        }
        if (event.target.matches("[data-feedback]")) {
          await submitReplyFeedback(event.target);
          return;
        }

        if (event.target.matches("[data-action='confirm-extraction']")) {
          await generateFromExtraction(event.target);
          return;
        }

        if (event.target.matches("[data-action='regenerate-candidate']")) {
          await regenerateCandidate(event.target);
          return;
        }

        if (!event.target.matches("#regenerate-button")) {
          return;
        }

        if (!latestResponse) {
          return;
        }

        const regenerateButton = event.target;
        const requestToken = beginReplyRequest();
        regenerateButton.disabled = true;
        regenerateButton.textContent = "重新生成中...";

        try {
          const payload = buildCorrectedPayload();
          const response = await fetch("/api/reply/corrected", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });

          if (!response.ok) {
            throw new Error(await readError(response));
          }

          const data = await response.json();
          if (requestToken === replyRequestToken) renderResult(data);
          else discardQualityJob(data.quality_job_id, data.user_id);
        } catch (error) {
          if (requestToken !== replyRequestToken) return;
          const errorBox = document.createElement("div");
          errorBox.className = "card error";
          errorBox.textContent = `重新生成失败：${error.message}`;
          result.prepend(errorBox);
        } finally {
          regenerateButton.disabled = false;
          regenerateButton.textContent = "使用修正重新生成";
        }
      });

      result.addEventListener("change", (event) => {
        if (!event.target.matches("[data-field='speaker'], [data-field='side']")) {
          return;
        }
        invalidateTopic();
        const row = event.target.closest("[data-message-index]");
        if (!row) {
          return;
        }
        const speakerSelect = row.querySelector("[data-field='speaker']");
        const sideSelect = row.querySelector("[data-field='side']");
        if (event.target.dataset.field === "side") {
          speakerSelect.value = {right: "me", left: "other"}[sideSelect.value] || "unknown";
        } else {
          sideSelect.value = {me: "right", other: "left"}[speakerSelect.value] || "unknown";
        }
        syncEditedMessage(row);
      });

      window.addEventListener("pagehide", revokePreviewUrls);

      function syncEditedMessage(row) {
        if (!row) return;
        const card = row.closest(".message");
        const speaker = row.querySelector("[data-field='speaker']");
        const side = row.querySelector("[data-field='side']");
        card.classList.remove("me", "other", "unknown");
        card.classList.add(speaker.value);
        card.querySelector("[data-speaker-label]").textContent = speaker.selectedOptions[0].textContent;
        card.querySelector("[data-side-label]").textContent = side.selectedOptions[0].textContent;
        const badge = card.querySelector(".message-confidence");
        badge.textContent = "已修改，待确认";
        badge.classList.add("warning");
        let lastOther = "暂无";
        result.querySelectorAll("[data-message-index]").forEach(messageRow => {
          const text = messageRow.querySelector("[data-field='text']").value.trim();
          if (text && messageRow.querySelector("[data-field='speaker']").value === "other") lastOther = text;
        });
        result.querySelectorAll("[data-last-other]").forEach(label => { label.textContent = lastOther; });
      }

      function renderSelectedImages(warning = "") {
        revokePreviewUrls();
        syncImageInputFiles();
        previewUrls = selectedImages.map((file) => URL.createObjectURL(file));
        uploadList.innerHTML = selectedImages
          .map(
            (file, index) => `
              <div class="upload-item">
                <div class="upload-order">${index + 1}</div>
                <img
                  class="upload-thumbnail"
                  src="${previewUrls[index]}"
                  alt="第 ${index + 1} 张截图预览"
                />
                <div class="upload-details">
                  <div class="upload-name">${escapeHtml(file.name)}</div>
                  <div class="meta">${formatFileSize(file.size)}</div>
                </div>
                <div class="upload-actions">
                  <button
                    class="upload-action"
                    type="button"
                    data-upload-action="up"
                    data-image-index="${index}"
                    title="将这张截图提前"
                    ${index === 0 ? "disabled" : ""}
                  >上移</button>
                  <button
                    class="upload-action"
                    type="button"
                    data-upload-action="down"
                    data-image-index="${index}"
                    title="将这张截图后移"
                    ${index === selectedImages.length - 1 ? "disabled" : ""}
                  >下移</button>
                  <button
                    class="upload-action remove"
                    type="button"
                    data-upload-action="remove"
                    data-image-index="${index}"
                    title="移除这张截图"
                  >移除</button>
                </div>
              </div>
            `,
          )
          .join("");

        uploadStatus.textContent = warning || (
          selectedImages.length
            ? `已选择 ${selectedImages.length} 张，将按 1 到 ${selectedImages.length} 的顺序识别。`
            : "尚未选择截图"
        );
        uploadStatus.classList.toggle("warning", Boolean(warning));
        updateSubmitButtonLabel();
      }

      function syncImageInputFiles() {
        try {
          const transfer = new DataTransfer();
          selectedImages.forEach((file) => transfer.items.add(file));
          imageInput.files = transfer.files;
        } catch {
          // The ordered in-memory list is still used for submission on older browsers.
        }
      }

      function revokePreviewUrls() {
        previewUrls.forEach((url) => URL.revokeObjectURL(url));
        previewUrls = [];
      }

      function formatFileSize(bytes) {
        if (!Number.isFinite(bytes) || bytes < 1024) return `${bytes || 0} B`;
        if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
        return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
      }

      function getBackgroundContext() {
        return backgroundInput.value.replace(/\r\n?/g, "\n").split("\n")
          .map(line => line.trim()).join("\n").replace(/\n{3,}/g, "\n\n").trim();
      }

      function updateSubmitButtonLabel() {
        if (button.disabled) return;
        button.textContent = selectedImages.length
          ? "识别并校对"
          : getBackgroundContext()
            ? "根据背景生成回复"
            : "开始分析";
      }

      function createBackgroundOnlyChat() {
        return {
          messages: [],
          topic: "",
          last_message_from_other: "",
          confidence: 0,
          notes: [],
          review_required: false,
          review_message_indexes: [],
          source_image_count: 0,
          merged_overlap_count: 0,
        };
      }

      function describeScreenshotMerge(chat) {
        const imageCount = Math.max(0, Number(chat?.source_image_count) || 0);
        const overlapCount = Math.max(0, Number(chat?.merged_overlap_count) || 0);
        if (imageCount === 0) return "未上传截图，仅使用文字背景";
        if (imageCount === 1) return "来源：1 张截图";
        return overlapCount
          ? `已按顺序合并 ${imageCount} 张截图，去除衔接重复 ${overlapCount} 条`
          : `已按顺序合并 ${imageCount} 张截图，未发现衔接重复`;
      }

      async function loadStatus() {
        try {
          const response = await fetch("/api/status");
          const data = await response.json();
          statusBox.classList.toggle("ready", data.llm_configured);
          statusBox.querySelector("span:last-child").textContent = data.llm_configured
            ? `回复：${data.models?.strong || data.text_model} · 识图：${data.vision_model}`
            : "未配置 .env，当前会使用本地占位识别";
          const retrieval = data.memory_retrieval;
          document.querySelector("#retrieval-status").textContent = retrieval
            ? `记忆检索：${retrieval.notice} ${retrieval.fallback_policy === "error" ? "严格模式：向量失败不降级。" : ""}` : "";
        } catch {
          statusBox.querySelector("span:last-child").textContent = "无法读取模型配置状态";
        }
      }

      async function loadContacts() {
        const userId = form.elements.user_id.value.trim() || "default";
        try {
          const response = await fetch(`/api/contacts?user_id=${encodeURIComponent(userId)}`);
          if (!response.ok) {
            return;
          }
          const data = await response.json();
          knownContacts = data.contacts || [];
          document.querySelector("#contact-options").innerHTML = knownContacts
            .map(
              (item) =>
                `<option value="${escapeHtml(item.contact_id)}">${escapeHtml(item.contact_name)}</option>`,
            )
            .join("");
        } catch {
          knownContacts = [];
        }
      }

      async function readError(response) {
        const text = await response.text();
        try {
          const data = JSON.parse(text);
          return data.detail || text;
        } catch {
          return text;
        }
      }

      async function generateFromExtraction(confirmButton) {
        if (!pendingExtraction) {
          return;
        }
        const editedChat = collectEditedChat(pendingExtraction);
        if (!editedChat.messages.length && !getBackgroundContext()) {
          result.prepend(createErrorBox("请至少保留一条聊天消息，或填写补充聊天背景。"));
          return;
        }

        const wasEdited = chatWasEdited(pendingExtraction, editedChat);
        const payload = buildChatPayload(
          editedChat,
          form.elements.relation_type.value,
          form.elements.contact_id.value,
          form.elements.contact_name.value,
        );
        confirmButton.disabled = true;
        const requestToken = beginReplyRequest();
        confirmButton.textContent = "生成中...";

        try {
          const response = await fetch(
            wasEdited ? "/api/reply/corrected" : "/api/reply/from-chat",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            },
          );
          if (!response.ok) {
            throw new Error(await readError(response));
          }
          const data = await response.json();
          if (requestToken === replyRequestToken) renderResult(data);
          else discardQualityJob(data.quality_job_id, data.user_id);
        } catch (error) {
          if (requestToken !== replyRequestToken) return;
          result.prepend(createErrorBox(`生成失败：${error.message}`));
          confirmButton.disabled = false;
          confirmButton.textContent = "确认内容并生成回复";
        }
      }

      function renderExtractionReview(data) {
        stopQualityPolling(latestResponse);
        pendingExtraction = data;
        latestResponse = null;
        contextNeedsRegeneration = false;
        const reviewCount = data.review_message_indexes?.length || 0;
        const reviewClass = data.review_required ? "review-banner warning" : "review-banner";
        const reviewText = data.review_required
          ? `有 ${reviewCount} 条消息存在识别疑点，请重点核对高亮内容。`
          : "模型未标出疑点，仍请核对文字和说话人后再生成。";

        result.innerHTML = `
          <div class="card">
            <h2>先校对截图内容</h2>
            ${renderBackgroundEvidence(getBackgroundContext(), true)}
            <p data-topic><strong>主题：</strong>待结合校对内容与补充背景分析</p>
            <p><strong>对方最后一条：</strong><span data-last-other>${escapeHtml(data.last_message_from_other || "暂无")}</span></p>
            <p class="meta">${escapeHtml(describeScreenshotMerge(data))} · 识别把握（模型估计，非准确率）：${Math.round((data.confidence || 0) * 100)}%</p>
            <div class="${reviewClass}">${escapeHtml(reviewText)}</div>
            <div class="message-list">${renderMessageEditors(data, "preview")}</div>
            <div class="review-actions">
              <button type="button" data-action="confirm-extraction">确认内容并生成回复</button>
            </div>
            ${data.notes?.length ? `<p class="meta">备注：${escapeHtml(data.notes.join("；"))}</p>` : ""}
          </div>
        `;
      }

      function renderMessageEditors(extractedChat, mode) {
        return extractedChat.messages.map((item, index) => {
          const speaker = {
            me: "我",
            other: "对方",
            unknown: "未知",
          }[item.speaker] || item.speaker;
          const side = {
            left: "左侧",
            right: "右侧",
            center: "中间",
            unknown: "位置未知",
          }[item.side] || item.side;
          const textConfidence = item.text_confidence == null ? "未知" : `${Math.round(item.text_confidence * 100)}%`;
          const speakerConfidence = item.speaker_confidence == null ? "未知" : `${Math.round(item.speaker_confidence * 100)}%`;
          const confidenceLabel = item.speaker_source === "user_confirmed"
            ? "已人工确认"
            : `模型估计：文字 ${textConfidence} · 说话人 ${speakerConfidence}`;
          const confidenceClass = item.needs_review
            ? "message-confidence warning"
            : "message-confidence";
          const hint = mode === "preview"
            ? "修改任意一项后再确认"
            : "修正后可重新生成";

          return `
            <div class="message ${escapeHtml(item.speaker)} ${item.needs_review ? "needs-review" : ""}">
              <div class="message-speaker">
                <span data-speaker-label>${escapeHtml(speaker)}</span> · <span data-side-label>${escapeHtml(side)}</span>${item.time ? ` · ${escapeHtml(item.time)}` : ""}
                <span class="${confidenceClass}">${confidenceLabel}</span>
              </div>
              <div class="message-edit" data-message-index="${index}">
                <div class="message-controls">
                  <select data-field="speaker" aria-label="第 ${index + 1} 条消息说话人">
                    <option value="me" ${item.speaker === "me" ? "selected" : ""}>我</option>
                    <option value="other" ${item.speaker === "other" ? "selected" : ""}>对方</option>
                    <option value="unknown" ${item.speaker === "unknown" ? "selected" : ""}>未知</option>
                  </select>
                  <select data-field="side" aria-label="第 ${index + 1} 条消息位置">
                    <option value="right" ${item.side === "right" ? "selected" : ""}>右侧</option>
                    <option value="left" ${item.side === "left" ? "selected" : ""}>左侧</option>
                    <option value="center" ${item.side === "center" ? "selected" : ""}>中间</option>
                    <option value="unknown" ${!item.side || item.side === "unknown" ? "selected" : ""}>未知位置</option>
                  </select>
                  <span class="meta">${hint}</span>
                </div>
                <textarea data-field="text" aria-label="第 ${index + 1} 条消息文字">${escapeHtml(item.text)}</textarea>
                ${item.warnings?.length ? `<ul class="message-warnings">${item.warnings.map((warning) => `<li>${escapeHtml(warning)}</li>`).join("")}</ul>` : ""}
              </div>
            </div>
          `;
        }).join("");
      }

      function renderResult(data) {
        if (latestResponse && latestResponse !== data) stopQualityPolling(latestResponse);
        latestResponse = data;
        if (data.quality_poll_job_id !== data.quality_job_id) {
          data.quality_edited_indexes = [];
          data.quality_diagnostics = null;
          data.quality_revisions = [];
          data.quality_adopted_indexes = [];
          data.quality_revision_report = null;
          data.quality_job_message = "";
          data.quality_gate_released = false;
          data.quality_poll_job_id = data.quality_job_id;
        }
        if (data.quality_job?.job_id === data.quality_job_id) readQualityJobMetadata(data, data.quality_job);
        pendingExtraction = null;
        contextNeedsRegeneration = false;
        const contactMemory = data.contact_memory || {};
        const messages = renderMessageEditors(data.extracted_chat, "result");

        const replies = data.replies
          .map((item, index) => {
            const review = data.quality?.items?.find(
              (qualityItem) => qualityItem.candidate_index === index,
            );
            return `
              <div class="reply" data-reply-index="${index}">
                <h3>
                  候选 ${index + 1}：${escapeHtml(item.style)}
                  ${
                    review
                      ? `<span class="quality-badge ${qualityLabel(review, item.text) === "基本可用" ? "passed" : "failed"}">${qualityLabel(review, item.text)}</span>`
                      : ""
                  }
                </h3>
                <textarea data-reply-text>${escapeHtml(item.text)}</textarea>
                <p class="meta" data-reply-reason>${escapeHtml(item.reason)}</p>
                ${item.source === "fallback" ? '<p class="meta">备用示例，发送前请确认</p>' : ""}
                ${item.warnings?.length ? `<p class="meta">${escapeHtml(item.warnings.join("；"))}</p>` : ""}
                <div data-quality-details>${renderQualityDetails(review, item.text)}</div>
                <div class="feedback-actions">
                  <button class="feedback-button regenerate-candidate" type="button" data-action="regenerate-candidate" data-candidate-index="${index}">重新生成这条</button>
                  ${
                    data.memory_persisted || data.memory_job_id
                      ? `
                        <button class="feedback-button accepted" type="button" data-feedback="accepted">采纳</button>
                        <button class="feedback-button" type="button" data-feedback="too_ai">太 AI</button>
                        <button class="feedback-button" type="button" data-feedback="too_long">太长</button>
                        <button class="feedback-button" type="button" data-feedback="too_oily">太油</button>
                        <button class="feedback-button" type="button" data-feedback="too_cold">太冷淡</button>
                        <button class="feedback-button" type="button" data-feedback="irrelevant">答非所问</button>
                        <button class="feedback-button" type="button" data-feedback="wrong_relation">不符合关系</button>
                      `
                      : `<span class="meta">临时模式不保存反馈</span>`
                  }
                </div>
                <div class="feedback-status meta"></div>
              </div>
            `;
          })
          .join("");

        const retrievedMemories = data.retrieved_memories || [];
        const controls = describeControlsForDisplay(data.controls || collectReplyControls());
        const persistenceNotice = memoryStatusText(data.memory_status);
        const styleEvidence = data.style_evidence || {};
        const currentStyleExamples = styleEvidence.current_examples || [];
        const profileStyleExamples = styleEvidence.profile_examples || [];
        const hasChatMessages = Boolean(data.extracted_chat?.messages?.length);
        const currentStyleDescription = styleEvidence.current_user_message_count
          ? escapeHtml(styleEvidence.current_summary || "已读取本人消息，暂未形成明显特征")
          : "本轮没有识别到“我”的消息，因此没有从当前聊天提取语气。";
        const stylePersistenceDescription = styleEvidence.current_user_message_count
          ? data.memory_persisted
            ? "本轮特征已合并到当前关系类型的本地画像。"
            : data.memory_job_id ? "后台保存完成后才会更新累计画像。" : "本轮仅用于生成，未写入本地画像。"
          : "本轮没有本人逐条消息，因此未更新本地画像。";
        const memorySources = retrievedMemories.length
          ? `<div class="memory-source-list">${retrievedMemories
              .map(
                (item) => `
                  <div class="memory-source">
                    <div class="memory-source-heading">
                      <strong>${escapeHtml(item.topic || item.scenario_label || "历史聊天")}</strong>
                      <span class="memory-score">相关度 ${item.relevance_score}%</span>
                      ${item.similarity_score != null && item.time_decay_factor != null ? `<span class="meta">${item.similarity_method === "semantic" ? "语义相似度" : item.similarity_method === "lexical_fallback" ? "关键词匹配（回退）" : "关键词匹配"} ${(item.similarity_score * 100).toFixed(1)}% × 时间权重 ${(item.time_decay_factor * 100).toFixed(1)}%</span>` : ""}
                      <span class="meta">${escapeHtml(formatDate(item.created_at))}</span>
                    </div>
                    <div>${escapeHtml(item.summary || "暂无概要")}</div>
                  </div>
                `,
              )
              .join("")}</div>`
          : `<p>这次没有找到足够相关的历史片段，回复只参考本次输入和联系人稳定记忆。</p>`;

        result.innerHTML = `
          <div class="card privacy-note">
            <strong data-memory-status>${escapeHtml(persistenceNotice)}</strong>
            ${["pending", "running"].includes(data.memory_status) ? '<button type="button" id="cancel-memory-job" class="feedback-button">取消本轮记忆保存</button>' : ""}
          </div>
          ${renderBackgroundEvidence(data.background_context)}
          ${renderWeatherEvidence(data.weather_evidence)}
          ${
            hasChatMessages
              ? `
                <div class="card">
                  <h2>截图识别结果</h2>
                  ${renderTopicSummary(data.extracted_chat)}
                  <p><strong>对方最后一条：</strong><span data-last-other>${escapeHtml(data.extracted_chat.last_message_from_other || "暂无")}</span></p>
                  <p class="meta">${escapeHtml(describeScreenshotMerge(data.extracted_chat))} · 识别置信度：${Math.round((data.extracted_chat.confidence || 0) * 100)}%</p>
                  <div class="message-list">${messages}</div>
                  <button id="regenerate-button" class="secondary-button" type="button">使用修正重新生成</button>
                  ${
                    data.extracted_chat.notes?.length
                      ? `<p class="meta">备注：${escapeHtml(data.extracted_chat.notes.join("；"))}</p>`
                      : ""
                  }
                </div>
              `
              : `
                <div class="card">
                  <h2>本次输入依据</h2>
                  ${renderTopicSummary(data.extracted_chat)}
                  <p>未上传聊天截图，本次分析和回复仅依据用户补充的文字背景。</p>
                  <p class="meta">概括内容不会作为双方逐字原话，也不会用于学习用户说话风格。</p>
                </div>
              `
          }
          <div class="card">
            <h2>关系分析</h2>
            <p><strong>语气：</strong>${escapeHtml(data.analysis.tone)}</p>
            <p><strong>情绪：</strong>${escapeHtml(data.analysis.emotion)}</p>
            <p><strong>态度：</strong>${escapeHtml(data.analysis.attitude)}</p>
            <p><strong>情境概述：</strong>${escapeHtml(data.analysis.scene)}</p>
            <p><strong>风险：</strong>${escapeHtml(data.analysis.risk_level)}</p>
          </div>
          <div class="card">
            <div class="scenario-heading">
              <h2>场景识别</h2>
              <span class="scenario-badge">${escapeHtml(data.scenario.label)}</span>
            </div>
            <p><strong>回复目标：</strong>${escapeHtml(data.scenario.reply_goal)}</p>
            <p class="meta">场景置信度：${Math.round((data.scenario.confidence || 0) * 100)}%</p>
            ${
              data.scenario.signals?.length
                ? `<strong>判断信号：</strong><ul class="signal-list">${data.scenario.signals
                    .map((item) => `<li>${escapeHtml(item)}</li>`)
                    .join("")}</ul>`
                : ""
            }
            ${
              data.scenario.cautions?.length
                ? `<p class="meta"><strong>注意：</strong>${escapeHtml(data.scenario.cautions.join("；"))}</p>`
                : ""
            }
          </div>
          <div class="card">
            <h2>回复时机</h2>
            <p><strong>${data.timing.should_reply_now ? "建议回复" : "建议先等等"}</strong></p>
            <p>${escapeHtml(data.timing.suggested_delay)}</p>
            <p class="meta">${escapeHtml(data.timing.reason)}</p>
          </div>
          <div class="card">
            <h2>本次回复设定</h2>
            <p><strong>意图：</strong>${escapeHtml(controls.intent)}</p>
            <p><strong>长度：</strong>${escapeHtml(controls.length)}　<strong>亲密度：</strong>${escapeHtml(controls.intimacy)}　<strong>主动度：</strong>${escapeHtml(controls.initiative)}</p>
            ${controls.custom ? `<p><strong>补充：</strong>${escapeHtml(controls.custom)}</p>` : ""}
          </div>
          <div class="card">
            <h2>真人语气依据</h2>
            <p><strong>本轮本人消息：</strong>${styleEvidence.current_user_message_count || 0} 条</p>
            <p class="style-evidence-note">${currentStyleDescription}</p>
            ${renderStylePhrases(currentStyleExamples, "本轮本人原句")}
            <p><strong>累计画像（生成时）：</strong>${escapeHtml(styleEvidence.profile_summary || "暂无累计画像")}</p>
            ${renderStylePhrases(profileStyleExamples, "累计本人原句")}
            <p class="meta">只从校对后标为“我”的消息学习；对方、未知说话人和补充背景都不会进入画像。<span data-style-persistence>${stylePersistenceDescription}</span></p>
          </div>
          <div class="card">
            <h2>回复策略</h2>
            <p>${escapeHtml(data.strategy)}</p>
          </div>
          <div class="card">
            <h2>
              回复质量
              <span data-quality-total class="quality-badge ${qualityGroupLabel(data.quality, data.replies) === "基本可用" ? "passed" : "failed"}">${qualityGroupLabel(data.quality, data.replies)}</span>
            </h2>
            <p><strong data-quality-state>评估仅供参考，不能保证对方的反应</strong></p>
            <p class="meta" data-quality-summary>${escapeHtml(qualitySummary(data.quality))}</p>
            <p data-quality-recommendation>${escapeHtml(qualityRecommendation(data.quality, data.replies))}</p>
            <p class="meta" data-quality-group>${escapeHtml(data.quality?.group_issues?.join("；") || data.quality?.group_reason || "候选组的接话差异尚未确认。")}</p>
            <p class="meta" data-quality-job-state aria-live="polite">${escapeHtml(qualityJobText(data.quality_status))}</p>
            <div class="feedback-actions">
              <button type="button" class="feedback-button" data-action="review-current">详细评估当前回复</button>
              <button type="button" class="feedback-button" data-action="cancel-quality" hidden>取消评估</button>
            </div>
            <div data-quality-diagnostics></div>
            ${renderDiagnostics(data.diagnostics)}
          </div>
          <div class="card" data-candidate-section>
            <h2>候选回复</h2>
            <p class="meta" data-quality-gate-notice></p>
            <div data-candidate-list>${replies}</div>
            <div data-quality-revisions></div>
          </div>
          <div class="card">
            <h2>本次参考的历史</h2>
            <p class="meta" data-retrieval-status>${escapeHtml(data.retrieval?.message || "检索方式以各条历史来源为准。")}</p>
            ${memorySources}
            <p class="meta">仅检索当前账号下这个聊天对象的本地记录；旧信息与当前聊天冲突时，以当前聊天为准。</p>
          </div>
          <div class="card">
            <h2>本次参考的联系人记忆</h2>
            <p><strong>聊天对象：</strong>${escapeHtml(data.contact_name || contactMemory.contact_name || "默认联系人")} <span class="meta">(${escapeHtml(data.contact_id || contactMemory.contact_id || "default-contact")})</span></p>
            <p><strong>历史概要：</strong>${escapeHtml(contactMemory.summary || "首次记录，暂无历史概要")}</p>
            <p><strong>已知事实：</strong>${escapeHtml(contactMemory.facts?.join("；") || "暂无")}</p>
            <p><strong>互动偏好：</strong>${escapeHtml(contactMemory.interaction_preferences?.join("；") || "暂无")}</p>
            <p class="meta">最近话题：${escapeHtml(contactMemory.last_topic || "暂无")} · 上次场景：${escapeHtml(contactMemory.last_scenario || "暂无")}</p>
          </div>
          <div class="card">
            <h2>本地记忆</h2>
            <p><strong>对话概要：</strong><span data-memory-summary>${escapeHtml(data.memory_summary || "暂无")}</span></p>
            <p><strong>用户风格：</strong><span data-memory-style>${escapeHtml(data.style_summary || "暂无")}</span></p>
            <p><strong>回复偏好：</strong><span id="preference-summary">${escapeHtml(data.preference_summary || "暂无")}</span></p>
            <p><strong>风格样本：</strong><span id="style-examples-summary">${escapeHtml(data.style_examples_summary || "暂无")}</span></p>
            <p class="meta" data-memory-record>${data.memory_persisted ? `保存记录 ID：${data.saved_memory_id ?? "-"}` : data.memory_job_id ? "任务已排队，尚未完成记忆更新" : "本轮未更新长期记忆"}</p>
          </div>
        `;
        loadContacts();
        startQualityPolling(data);
        if (getBackgroundContext() !== (data.background_context || "").trim()) invalidateTopic();
        result.querySelectorAll("[data-feedback]").forEach(button => { button.disabled = !data.memory_persisted; });
        const pollToken = ++memoryPollToken;
        if (["pending", "running"].includes(data.memory_status)) {
          pollMemory(data, pollToken);
          document.getElementById("cancel-memory-job")?.addEventListener("click", async (event) => {
            const button = event.currentTarget;
            button.disabled = true;
            try {
              const response = await fetch(`/api/memory-jobs/${encodeURIComponent(data.memory_job_id)}?user_id=${encodeURIComponent(data.user_id || "default")}`, {method: "DELETE"});
              if (!response.ok) throw new Error("任务可能已完成，请查看保存状态或在管理页删除记忆。");
              if (latestResponse === data) updateMemoryStatus(data, {status: "cancelled", memory_persisted: false});
            } catch (error) {
              if (latestResponse === data) result.querySelector("[data-memory-status]").textContent = error.message;
              button.disabled = false;
            }
          });
        }
      }

      function memoryStatusText(status) {
        return {pending: "回复已生成，记忆等待后台保存。", running: "回复已生成，记忆正在后台整理。",
          completed: "本轮记忆已保存，可在管理页查看或删除。", failed: "后台记忆更新失败，本轮未保存；可重新生成后再试。",
          cancelled: "本轮记忆保存已取消或记录已删除。", disabled: "本轮未更新长期记忆（临时模式或未完成真实生成）。"}[status] || "尚未保存";
      }

      function updateMemoryStatus(data, state) {
        data.memory_status = state.status;
        data.memory_persisted = state.memory_persisted;
        data.saved_memory_id = state.saved_memory_id ?? null;
        result.querySelector("[data-memory-status]").textContent = memoryStatusText(state.status);
        result.querySelector("[data-memory-record]").textContent = state.memory_persisted ? `保存记录 ID：${state.saved_memory_id}` : memoryStatusText(state.status);
        result.querySelectorAll("[data-feedback]").forEach(button => { button.disabled = !state.memory_persisted; });
        if (!["pending", "running"].includes(state.status)) document.getElementById("cancel-memory-job")?.remove();
        if (state.memory_persisted) {
          data.memory_summary = state.memory_summary;
          data.style_summary = state.style_summary;
          result.querySelector("[data-memory-summary]").textContent = state.memory_summary || "暂无";
          result.querySelector("[data-memory-style]").textContent = state.style_summary || "暂无";
          if (data.style_evidence?.current_user_message_count) result.querySelector("[data-style-persistence]").textContent = "本轮特征已在后台合并到累计画像。";
          loadContacts();
        }
      }

      async function pollMemory(data, token) {
        for (let attempt = 0; attempt < 180; attempt++) {
          await new Promise(resolve => setTimeout(resolve, 1500));
          if (token !== memoryPollToken || latestResponse !== data || !["pending", "running"].includes(data.memory_status)) return;
          try {
            const response = await fetch(`/api/memory-jobs/${encodeURIComponent(data.memory_job_id)}?user_id=${encodeURIComponent(data.user_id || "default")}`);
            const state = response.status === 404 ? {status: "cancelled", memory_persisted: false} : await response.json();
            if (token !== memoryPollToken || latestResponse !== data || !["pending", "running"].includes(data.memory_status)) return;
            if (!response.ok && response.status !== 404) continue;
            updateMemoryStatus(data, state);
            if (!["pending", "running"].includes(state.status)) return;
          } catch (_) { /* A transient polling failure must not overwrite edited replies. */ }
        }
        if (token === memoryPollToken && latestResponse === data) result.querySelector("[data-memory-status]").textContent = "暂未确认保存结果，任务仍可在后台执行；稍后在管理页查看。";
      }

      async function submitReplyFeedback(button) {
        if (!latestResponse) {
          return;
        }

        const replyCard = button.closest("[data-reply-index]");
        const index = Number(replyCard.dataset.replyIndex);
        const textarea = replyCard.querySelector("[data-reply-text]");
        const status = replyCard.querySelector(".feedback-status");
        const original = latestResponse.replies[index] || {};
        const previousLabel = button.textContent;

        button.disabled = true;
        button.textContent = "保存中...";
        status.textContent = "";

        try {
          const response = await fetch("/api/reply/feedback", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              relation_type: latestResponse.relation_type,
              user_id: latestResponse.user_id || "default",
              feedback_type: button.dataset.feedback,
              candidate_index: index,
              candidate_text: original.text || "",
              edited_text: textarea.value.trim(),
              memory_id: latestResponse.saved_memory_id,
            }),
          });

          if (!response.ok) {
            throw new Error(await readError(response));
          }

          const data = await response.json();
          latestResponse.preference_summary = data.preference_summary;
          latestResponse.style_examples_summary = data.style_examples_summary;
          status.textContent = `已保存反馈 #${data.feedback_id}`;
          const preferenceBox = result.querySelector("#preference-summary");
          if (preferenceBox) {
            preferenceBox.textContent = data.preference_summary || "暂无";
          }
          const styleExamplesBox = result.querySelector("#style-examples-summary");
          if (styleExamplesBox) {
            styleExamplesBox.textContent = data.style_examples_summary || "暂无";
          }
        } catch (error) {
          status.textContent = `保存失败：${error.message}`;
        } finally {
          button.disabled = false;
          button.textContent = previousLabel;
        }
      }

      async function regenerateCandidate(button) {
        if (!latestResponse) return;
        if (contextNeedsRegeneration) {
          result.prepend(createErrorBox("聊天内容或背景已修改，请先重新生成整组回复。"));
          return;
        }
        const index = Number(button.dataset.candidateIndex);
        if (!Number.isInteger(index) || index < 0 || index > 2) return;

        syncEditedReplyTexts();
        const owner = latestResponse;
        const requestToken = beginReplyRequest();
        const draftTexts = Array.from(result.querySelectorAll("[data-reply-text]"), input => input.value);
        const previousLabel = button.textContent;
        button.disabled = true;
        button.textContent = "生成中...";

        try {
          const response = await fetch("/api/reply/regenerate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              relation_type: latestResponse.relation_type,
              user_id: latestResponse.user_id || "default",
              contact_id: latestResponse.contact_id,
              contact_name: latestResponse.contact_name,
              extracted_chat: latestResponse.extracted_chat,
              background_context: latestResponse.background_context || "",
              analysis: latestResponse.analysis,
              scenario: latestResponse.scenario,
              existing_replies: latestResponse.replies,
              candidate_index: index,
              controls: latestResponse.controls || collectReplyControls(),
              weather_evidence: latestResponse.weather_evidence || [],
            }),
          });
          if (!response.ok) throw new Error(await readError(response));

          const data = await response.json();
          if (owner !== latestResponse || requestToken !== replyRequestToken) {
            discardQualityJob(data.quality_job_id, owner.user_id);
            return;
          }
          const currentInputs = Array.from(result.querySelectorAll("[data-reply-text]"));
          if (currentInputs.some((input, i) => input.value !== draftTexts[i])) {
            discardQualityJob(data.quality_job_id, owner.user_id);
            throw new Error("生成期间回复文字已修改，已保留你的编辑；请再次操作。");
          }
          latestResponse.replies[index] = data.reply;
          latestResponse.diagnostics = data.diagnostics;
          latestResponse.weather_evidence = [...(latestResponse.weather_evidence || []), ...(data.weather_evidence || [])].slice(-6);
          latestResponse.quality = data.quality_report || latestResponse.quality;
          latestResponse.quality_job_id = data.quality_job_id;
          latestResponse.quality_status = data.quality_status;
          latestResponse.quality_job = data.quality_job;
          latestResponse.quality_gate_required = data.quality_gate_required;
          latestResponse.quality_edited_indexes = [];
          renderResult(latestResponse);
          const updatedCard = result.querySelector(`[data-reply-index="${index}"]`);
          if (updatedCard) {
            updatedCard.querySelector(".feedback-status").textContent = "已重新生成这一条，未重复写入记忆";
          }
        } catch (error) {
          if (owner !== latestResponse || requestToken !== replyRequestToken) return;
          const card = button.closest("[data-reply-index]");
          card.querySelector(".feedback-status").textContent = `重新生成失败：${error.message}`;
        } finally {
          if (button.isConnected) {
            button.disabled = false;
            button.textContent = previousLabel;
          }
        }
      }

      function syncEditedReplyTexts() {
        result.querySelectorAll("[data-reply-index]").forEach((card) => {
          const index = Number(card.dataset.replyIndex);
          const textarea = card.querySelector("[data-reply-text]");
          if (latestResponse.replies[index] && textarea) {
            const edited = textarea.value.trim();
            if (edited !== latestResponse.replies[index].text) {
              latestResponse.replies[index].text = edited;
              updateSingleQuality({candidate_index: index, overall_score: null, assessment_source: "local", verdict: "unverified", status: "not_reviewed", passed: false, issues: ["手动编辑后需重新质检"]}, index);
            }
          }
        });
      }

      function updateSingleQuality(quality, index) {
        const report = latestResponse.quality || { items: [] };
        const items = (report.items || []).filter((item) => item.candidate_index !== index);
        items.push(quality);
        items.sort((left, right) => left.candidate_index - right.candidate_index);
        report.items = items;
        report.average_score = null;
        report.passed = false;
        report.status = "partial";
        report.diversity_status = "not_reviewed";
        report.group_issues = ["候选已变动，组内差异需重新确认。"];
        report.group_reason = "";
        report.recommended_candidate_indexes = [];
        report.recommendation_reason = "";
        report.summary = "已更新单条候选的检查状态；不沿用旧组合的评价。";
        latestResponse.quality = report;
      }

      function qualityLabel(review, text) {
        if (!review) return "尚未复核";
        if (!review.assessment_source || review.assessment_source === "legacy") return "历史评价，未校准";
        if (["pending", "running"].includes(review.status)) return "后台评估中";
        if (review.status === "revised_pending") return "已修改，待确认";
        if (["unavailable", "invalid_response"].includes(review.status)) return "复核未完成";
        if (review.status !== "reviewed") return "仅本地检查";
        if (review.evaluated_text !== text) return "文本已变，待确认";
        return {usable: "基本可用", needs_attention: "建议调整", uncertain: "信息不足"}[review.verdict] || "尚未确认";
      }

      function qualityGroupLabel(report, replies) {
        if (!report?.items?.length) return "尚未复核";
        if (["pending", "running"].includes(report.status)) return "后台评估中";
        if (report.items.every(item => !item.assessment_source || item.assessment_source === "legacy")) return "历史评价，未校准";
        if (report.diversity_status === "similar") return "候选差异不足";
        if (report.passed && report.diversity_status === "distinct" && replies.every((reply, index) =>
          qualityLabel(report.items.find(item => item.candidate_index === index), reply.text) === "基本可用")) return "基本可用";
        return "待确认";
      }

      function qualitySummary(report) {
        if (report?.items?.length && report.items.every(item => !item.assessment_source || item.assessment_source === "legacy")) {
          return "历史评分没有采用当前评估规范，不作为可靠质量结论；重新生成后使用新规则。";
        }
        const mode = report?.review_mode === "quick" ? "精简评审" : "完整评审";
        return report?.summary ? `${mode}：${report.summary}` : "暂无质量报告";
      }

      function qualityRecommendation(report, replies) {
        if (report?.status !== "reviewed" || !report.recommended_candidate_indexes?.length ||
            !replies?.every((reply, index) => {
              const item = report.items?.find(item => item.candidate_index === index);
              return item?.status === "reviewed" && item.evaluated_text === reply.text;
            })) return "";
        const indexes = report.recommended_candidate_indexes;
        if (!indexes.every(index => Number.isInteger(index) && index >= 0 && index < replies.length &&
            report.items.find(item => item.candidate_index === index)?.verdict === "usable")) return "";
        return `优先参考：${indexes.map(index => `候选 ${index + 1}`).join("、")}。${report.recommendation_reason || "请结合自己的表达意愿选择。"}`;
      }

      function renderQualityDetails(review, text) {
        if (!review || !review.assessment_source || review.assessment_source === "legacy") return "";
        if (review.status === "reviewed" && review.evaluated_text !== text) {
          return '<p class="meta">文本已变化，旧评价依据不再适用。</p>';
        }
        const notes = [...new Set([...(review.hard_issues || []), ...(review.issues || [])])];
        const warnings = (notes.length ? `<p class="meta"><strong>需要调整：</strong>${escapeHtml(notes.join("；"))}</p>` : "")
          + (review.uncertainties?.length ? `<p class="meta"><strong>需补充的关键信息：</strong>${escapeHtml(review.uncertainties.join("；"))}</p>` : "");
        if (review.status !== "reviewed") return warnings;
        const labels = {naturalness: "说话自然度", relevance: "接话与立场", relation_fit: "关系分寸", scenario_fit: "情境与情绪", style_fit: "本人风格"};
        const evidence = Object.entries(labels).filter(([key]) => review.evidence?.[key]);
        const grades = {1: "明显问题", 2: "需要修改", 3: "仍有不足", 4: "基本贴切", 5: "尤其贴切"};
        return (review.conclusion ? `<p><strong>判断：</strong>${escapeHtml(review.conclusion)}</p>` : "") + warnings
          + `<dl class="quality-grades">${Object.entries(labels).map(([key, label]) =>
            `<div><dt>${label}</dt><dd>${Number.isInteger(review[key]) && grades[review[key]] ? `${review[key]}/5 · ${grades[review[key]]}` : "暂不计分"}</dd></div>`).join("")}</dl>`
          + (review.advisories?.length ? `<p class="meta"><strong>普通提醒（不阻止使用）：</strong>${escapeHtml(review.advisories.join("；"))}</p>` : "")
          + (evidence.length ? `<details><summary>查看评估依据</summary>${evidence.map(([key, label]) =>
          `<p class="meta"><strong>${label}${review[key] == null ? "（未确认）" : ""}：</strong>${escapeHtml(review.evidence[key])}</p>`
        ).join("")}<p class="meta">模型判断，不等于人工确认。</p></details>` : "");
      }

      function qualityJobText(status) {
        return {pending: "后台评估排队中", running: "后台评估中，不会修改回复文字", completed: "后台评估已完成",
          failed: "评估未完成，可重试", timed_out: "评估超时，可重试", cancelled: "评估已取消",
          busy: "评估队列已满，稍后可重试", unavailable: "暂未取得评估结果，可重试", disabled: "本轮未进行后台评估"}[status] || "";
      }

      function readQualityJobMetadata(data, job) {
        data.quality_diagnostics = job.diagnostics || {};
        data.quality_phase = job.phase || "queued";
        data.quality_job_message = job.message || "";
        data.quality_repair_status = job.repair_status || "not_needed";
        if (job.status === "completed" && JSON.stringify(job.candidate_texts) === JSON.stringify(data.replies.map(r => r.text))) {
          data.quality_revision_originals = [...job.candidate_texts];
          data.quality_revisions = job.revision_replies || [];
          data.quality_revision_report = job.revision_quality;
        }
      }

      function renderQualityDiagnostics(data) {
        const d = data.quality_diagnostics;
        if (d?.total_ms == null) return "";
        const phases = {queued: "排队", review: "原文评估", repair: "定向修订", recheck: "改进版复评"};
        const stages = {"quality.background": "原文评估", "quality.repair": "定向修订", "quality.recheck": "改进版复评"};
        const calls = d.model_calls || [];
        const reviewMode = d.phase_review_mode || d.review_mode || data.quality?.review_mode;
        const mode = {quick: "精简评审", full: "完整评审"}[reviewMode] || "评审";
        return `<p class="meta">${mode}；后台处理 ${(d.total_ms / 1000).toFixed(2)} 秒，排队 ${((d.queue_wait_ms || 0) / 1000).toFixed(2)} 秒；当前阶段：${phases[d.phase] || "评估"}。</p>
          ${d.error_message ? `<p class="error">${escapeHtml(d.error_message)}${d.worker_active ? " 上游请求仍在收尾，相同任务不会重复发起。" : ""}</p>` : ""}
          <details><summary>后台诊断</summary><p class="meta">任务：${escapeHtml(data.quality_job_id || "未排队")}；诊断编号：${escapeHtml(d.request_id || "未开始调用")}；错误类型：${escapeHtml(d.error_code || "无")}</p>
          <p class="meta">每阶段预算 ${d.model_timeout_seconds ?? "-"} 秒；流程预算 ${d.total_budget_seconds ?? "-"} 秒，不含排队。</p>
          <ul>${(d.stages || []).filter(s => stages[s.stage]).map(s => `<li>${stages[s.stage]}：${(s.duration_ms / 1000).toFixed(2)} 秒${s.status === "error" ? "（未完成）" : ""}</li>`).join("")}</ul>
          ${(d.validation_errors || []).length ? `<p class="meta">评价校验详情（不一定是 JSON 格式错误）：</p><ul>${d.validation_errors.map(e => `<li>${escapeHtml(e.path)}：${escapeHtml(qualityValidationReason(e.type))} <span class="meta">(${escapeHtml(e.type)})</span></li>`).join("")}</ul>` : ""}
          ${calls.map(c => `<p class="meta">${escapeHtml(c.model || "")}：输入 ${c.prompt_tokens ?? "未知"} tokens，输出 ${c.completion_tokens ?? "未知"} tokens，其中推理 ${c.reasoning_tokens ?? "未知"} tokens。</p>`).join("")}</details>`;
      }

      function qualityValidationReason(type) {
        const labels = {
          invalid_or_empty_json_object: "返回内容无法解析为完整 JSON",
          original_text_mismatch: "模型回传原文与被评估文本不一致",
          unexpected_candidate_id: "候选编号不属于本次评估",
          duplicate_candidate_id: "候选编号重复，未采用重复条目",
          batch_binding_mismatch: "候选组版本缺失或不匹配",
          unexpected_fields: "返回了协议外字段，可能包含未经允许的改写",
          missing_or_blank_evidence: "本维度缺少评价依据",
          missing_or_invalid_score: "本维度的判断缺失或超出范围",
          missing_or_invalid_group_evidence: "整组差异的评价依据不完整",
          missing_target: "缺少这条候选的评价",
          wrong_item_count: "返回的评价数量与候选数量不一致",
        };
        return labels[type] || "返回字段不符合本次评估要求";
      }

      function refreshQualityRevisions(data) {
        const container = result.querySelector("[data-quality-revisions]");
        if (!container) return;
        const revisions = data.quality_revisions || [];
        const originals = data.quality_revision_originals || [];
        const signature = JSON.stringify([revisions, originals, data.quality_repair_status, data.quality_edited_indexes, data.quality_adopted_indexes,
          Array.from(result.querySelectorAll("[data-reply-text]"), input => input.value)]);
        if (container.dataset.signature === signature) return;
        container.dataset.signature = signature;
        container.innerHTML = revisions.length === 3 ? `<h3>独立改进版</h3><p class="meta">后台不会覆盖原稿；改进版已另行复评，模型判断仍需你确认。</p>` + revisions.map((reply, index) => {
          if (reply.text === originals[index]) return "";
          const review = data.quality_revision_report?.items?.find(i => i.candidate_index === index);
          const input = result.querySelector(`[data-reply-index="${index}"] [data-reply-text]`);
          const adopted = data.quality_adopted_indexes?.includes(index) && input?.value === reply.text && !data.quality_edited_indexes?.includes(index);
          const stale = !adopted && (input?.value !== originals[index] || data.quality_edited_indexes?.includes(index));
          const usable = data.quality_repair_status === "completed" && qualityLabel(review, reply.text) === "基本可用";
          return `<div class="reply" data-revision-index="${index}"><h3>候选 ${index + 1} 的改进版 <span class="quality-badge ${usable && !stale ? "passed" : "failed"}">${adopted ? "已使用" : stale ? "原稿已变，需重新评估" : usable ? "已复评，基本可用" : "复评仍待确认"}</span></h3>
            <p style="white-space:pre-wrap;overflow-wrap:anywhere">${escapeHtml(reply.text)}</p>${renderQualityDetails(review, reply.text)}
            <button type="button" class="feedback-button" data-action="use-revision" data-index="${index}" ${adopted || stale || !usable ? "disabled" : ""}>${adopted ? "已使用" : "使用这条改进版"}</button></div>`;
        }).join("") : "";
      }

      function useQualityRevision(button) {
        const data = latestResponse;
        const index = Number(button.dataset.index);
        if (!data || contextNeedsRegeneration || data.quality_status !== "completed" || data.quality_repair_status !== "completed") return;
        const reply = data.quality_revisions?.[index];
        const review = data.quality_revision_report?.items?.find(item => item.candidate_index === index);
        const input = result.querySelector(`[data-reply-index="${index}"] [data-reply-text]`);
        if (!reply || !input || data.quality_edited_indexes?.includes(index) || input.value !== data.quality_revision_originals?.[index]
            || qualityLabel(review, reply.text) !== "基本可用") return;
        // Only an explicit click may replace a draft. Polling never writes its value.
        input.value = reply.text;
        data.replies[index] = {...reply};
        data.quality_adopted_indexes = [...(data.quality_adopted_indexes || []), index];
        const reason = result.querySelector(`[data-reply-index="${index}"] [data-reply-reason]`);
        if (reason) reason.textContent = reply.reason;
        updateSingleQuality({...review}, index);
        refreshQualityUI(data);
      }

      function discardQualityJob(jobId, userId) {
        if (!jobId) return;
        fetch(`/api/quality-jobs/${encodeURIComponent(jobId)}?user_id=${encodeURIComponent(userId || "default")}`,
          {method: "DELETE"}).catch(() => {});
      }

      function beginReplyRequest() {
        stopQualityPolling(latestResponse, "正在重新生成，旧评估不再适用。");
        return ++replyRequestToken;
      }

      function stopQualityPolling(data, message) {
        ++qualityPollToken;
        if (!data) return;
        if (["pending", "running"].includes(data.quality_status)) discardQualityJob(data.quality_job_id, data.user_id);
        data.quality_status = "cancelled";
        data.quality_job_message = "";
        data.quality_revisions = [];
        data.quality_adopted_indexes = [];
        data.quality_revision_report = null;
        if (data.quality) Object.assign(data.quality, {recommended_candidate_indexes: [], recommendation_reason: ""});
        if (message && latestResponse === data) {
          data.quality_diagnostics = null;
          data.quality = {status: "not_reviewed", passed: false, average_score: null, summary: message,
            diversity_status: "not_reviewed", group_issues: [], items: (data.replies || []).map((reply, candidate_index) =>
              ({candidate_index, status: "not_reviewed", assessment_source: "local", verdict: "unverified", passed: false}))};
          refreshQualityUI(data);
        }
      }

      function setQualityJobState(data, state, message) {
        data.quality_status = state;
        data.quality_job_message = message || "";
        const active = ["pending", "running"].includes(state);
        const dirty = data.quality_edited_indexes || [];
        const report = data.quality || {items: []};
        report.status = active && !dirty.length ? state : "partial";
        report.summary = message || qualityJobText(state);
        report.passed = false;
        report.average_score = null;
        report.recommended_candidate_indexes = [];
        report.recommendation_reason = "";
        for (const item of report.items) {
          if (["pending", "running"].includes(item.status) && !dirty.includes(item.candidate_index)) {
            item.status = active ? state : "unavailable";
          }
        }
        data.quality = report;
        refreshQualityUI(data);
      }
