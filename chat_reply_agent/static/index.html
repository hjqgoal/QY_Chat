      function refreshQualityUI(data) {
        if (data !== latestResponse) return;
        const report = data.quality;
        result.querySelectorAll("[data-reply-index]").forEach(card => {
          const index = Number(card.dataset.replyIndex);
          const input = card.querySelector("[data-reply-text]");
          const review = report?.items?.find(item => item.candidate_index === index);
          const edited = data.quality_edited_indexes?.includes(index);
          const label = edited ? "已编辑，待确认" : qualityLabel(review, input.value);
          const badge = card.querySelector(".quality-badge");
          if (badge) {
            badge.textContent = label;
            badge.classList.toggle("passed", label === "基本可用");
            badge.classList.toggle("failed", label !== "基本可用");
          }
          const details = card.querySelector("[data-quality-details]");
          if (details) details.innerHTML = edited ? '<p class="meta">文字已编辑，旧评估不适用。可评估当前回复。</p>' : renderQualityDetails(review, input.value);
        });
        const total = result.querySelector("[data-quality-total]");
        const label = qualityGroupLabel(report, data.replies);
        if (total) {
          total.textContent = label;
          total.classList.toggle("passed", label === "基本可用");
          total.classList.toggle("failed", label !== "基本可用");
        }
        const texts = {"[data-quality-summary]": qualitySummary(report),
          "[data-quality-recommendation]": qualityRecommendation(report, data.replies),
          "[data-quality-state]": "评估仅供参考，不能保证对方的反应",
          "[data-quality-group]": report?.group_issues?.join("；") || report?.group_reason || (report?.diversity_status === "distinct" ? "候选有不同的接话作用。" : "候选组差异尚未确认。"),
          "[data-quality-job-state]": data.quality_job_message || qualityJobText(data.quality_status)};
        for (const [selector, text] of Object.entries(texts)) {
          const element = result.querySelector(selector);
          if (element) element.textContent = text;
        }
        const active = ["pending", "running"].includes(data.quality_status);
        const retry = result.querySelector("[data-action='review-current']");
        const cancel = result.querySelector("[data-action='cancel-quality']");
        if (retry) retry.disabled = active;
        if (cancel) cancel.hidden = !active;
        const diagnostics = result.querySelector("[data-quality-diagnostics]");
        if (diagnostics) diagnostics.innerHTML = renderQualityDiagnostics(data);
        const list = result.querySelector("[data-candidate-list]");
        const notice = result.querySelector("[data-quality-gate-notice]");
        const gated = data.quality_gate_required && !data.quality_gate_released && active;
        if (list) list.hidden = Boolean(gated);
        if (!active) data.quality_gate_released = true;
        if (notice) notice.textContent = gated ? "本轮涉及关系边界或不确定信息，先完成复核再展示候选。" :
          data.quality_gate_required && !report?.passed ? "以下原稿尚未通过完整验证，请先查看具体问题；可用改进版单独列出。" :
          active ? "以下是未评估草稿，后台结果不会覆盖你的编辑。" : "";
        refreshQualityRevisions(data);
      }

      function applyQualityResult(data, payload, submittedTexts) {
        if (payload.job_id !== data.quality_job_id || !payload.quality ||
            JSON.stringify(payload.candidate_texts) !== JSON.stringify(submittedTexts)) return false;
        const dirty = new Set(data.quality_edited_indexes || []);
        const items = [];
        for (let index = 0; index < submittedTexts.length; index++) {
          const input = result.querySelector(`[data-reply-index="${index}"] [data-reply-text]`);
          const review = payload.quality.items?.find(item => item.candidate_index === index);
          if (!input || input.value !== submittedTexts[index] || data.replies[index].text !== submittedTexts[index]) dirty.add(index);
          if (dirty.has(index)) {
            items.push({candidate_index: index, status: "not_reviewed", assessment_source: "local", verdict: "unverified", passed: false});
          } else {
            if (!review || (review.status === "reviewed" && review.evaluated_text !== submittedTexts[index])) return false;
            items.push(review);
          }
        }
        data.quality_edited_indexes = Array.from(dirty);
        data.quality = {...payload.quality, items, average_score: null};
        if (dirty.size) {
          Object.assign(data.quality, {passed: false, status: "partial", diversity_status: "not_reviewed",
            recommended_candidate_indexes: [], recommendation_reason: "", group_reason: "",
            summary: "未修改的候选已完成评估；编辑过的候选需重新评估。", group_issues: ["候选已编辑，旧组合的差异评价不适用。"]});
        }
        data.quality_status = "completed";
        readQualityJobMetadata(data, payload);
        refreshQualityUI(data);
        return true;
      }

      function startQualityPolling(data) {
        const token = ++qualityPollToken;
        refreshQualityUI(data);
        if (data.quality_job_id && ["pending", "running"].includes(data.quality_status)) {
          pollQuality(data, token, data.quality_job_id, data.replies.map(reply => reply.text));
        }
      }

      async function pollQuality(data, token, jobId, submittedTexts) {
        const active = () => latestResponse === data && token === qualityPollToken && data.quality_job_id === jobId
          && ["pending", "running"].includes(data.quality_status);
        let errors = 0;
        for (let attempt = 0; attempt < 480 && active(); attempt++) {
          try {
            const response = await fetch(`/api/quality-jobs/${encodeURIComponent(jobId)}?user_id=${encodeURIComponent(data.user_id || "default")}`);
            if (!active()) return;
            if (response.status === 404) {
              setQualityJobState(data, "unavailable", "评估任务已过期或服务已重启，可重新评估。");
              return;
            }
            if (!response.ok) throw new Error("poll failed");
            const payload = await response.json();
            if (!active()) return;
            if (payload.job_id !== jobId) throw new Error("wrong job");
            errors = 0;
            data.quality_diagnostics = payload.diagnostics || {};
            data.quality_phase = payload.phase;
            if (payload.status === "completed") {
              if (!applyQualityResult(data, payload, submittedTexts)) setQualityJobState(data, "unavailable", "评估结果与本轮文字不一致，未应用，可重新评估。");
              return;
            }
            if (!["pending", "running"].includes(payload.status)) {
              setQualityJobState(data, payload.status, payload.message);
              return;
            }
            setQualityJobState(data, payload.status, payload.message);
          } catch {
            if (!active()) return;
            if (++errors >= 3) {
              setQualityJobState(data, "unavailable", "暂时无法获取评估进度；不能据此认定评估通过，可稍后重试。");
              return;
            }
          }
          await new Promise(resolve => setTimeout(resolve, 2000));
        }
        if (active()) setQualityJobState(data, "unavailable", "等待评估结果已超时，可重新评估。");
      }

      async function reviewCurrentReplies(reviewButton) {
        if (!latestResponse) return;
        if (contextNeedsRegeneration) {
          result.prepend(createErrorBox("聊天背景已修改，请先重新生成整组回复。"));
          return;
        }
        const currentTexts = Array.from(result.querySelectorAll("[data-reply-text]"), input => input.value);
        if (currentTexts.length !== 3 || currentTexts.some(text => !text.trim() || Array.from(text).length > 600)) {
          result.prepend(createErrorBox("请确认三条回复均非空，且每条不超过 600 字，再进行评估。"));
          return;
        }
        syncEditedReplyTexts();
        const owner = latestResponse;
        owner.quality_gate_released = true;
        stopQualityPolling(owner);
        const token = qualityPollToken;
        const submittedTexts = owner.replies.map(reply => reply.text);
        const inputs = Array.from(result.querySelectorAll("[data-reply-text]"), input => input.value);
        owner.quality_edited_indexes = [];
        owner.quality_diagnostics = null;
        reviewButton.disabled = true;
        try {
          const response = await fetch("/api/quality-jobs", {method: "POST", headers: {"Content-Type": "application/json"},
            body: JSON.stringify({user_id: owner.user_id, relation_type: owner.relation_type, contact_id: owner.contact_id,
              contact_name: owner.contact_name, extracted_chat: owner.extracted_chat, background_context: owner.background_context || "",
              controls: owner.controls || collectReplyControls(), replies: owner.replies, weather_evidence: owner.weather_evidence || [], save_to_memory: false})});
          if (!response.ok) throw new Error(await readError(response));
          const job = await response.json();
          if (owner !== latestResponse || token !== qualityPollToken) {
            discardQualityJob(job.job_id, owner.user_id);
            return;
          }
          if (JSON.stringify(job.candidate_texts) !== JSON.stringify(submittedTexts)) {
            discardQualityJob(job.job_id, owner.user_id);
            throw new Error("评估任务与提交文字不一致");
          }
          Array.from(result.querySelectorAll("[data-reply-text]")).forEach((input, index) => {
            if (input.value !== inputs[index]) owner.quality_edited_indexes.push(index);
          });
          owner.quality_job_id = job.job_id;
          owner.quality_poll_job_id = job.job_id;
          owner.quality_status = job.status;
          owner.quality = job.quality;
          readQualityJobMetadata(owner, job);
          startQualityPolling(owner);
        } catch (error) {
          if (owner === latestResponse && token === qualityPollToken) setQualityJobState(owner, "unavailable", `未能开始评估：${error.message}`);
        } finally {
          if (owner === latestResponse) reviewButton.disabled = ["pending", "running"].includes(owner.quality_status);
        }
      }

      function renderWeatherEvidence(evidence) {
        if (!evidence?.length) return "";
        const range = (value, unit) => value?.min != null && value?.max != null
          ? `${escapeHtml(String(value.min))} ~ ${escapeHtml(String(value.max))} ${unit}` : "未获取";
        const labels = {ok: "已获取", partial: "部分数据可用", needs_clarification: "地点需确认", not_found: "地点未找到",
          unavailable: "查询未完成", unsupported_date: "日期超出支持范围", invalid_arguments: "查询条件有误", disabled: "查询已关闭"};
        const periods = {day: "全天", morning: "上午", afternoon: "下午", evening: "晚间"};
        return `<div class="card"><h2>天气依据</h2>${evidence.map(item => {
          const data = item.result || {};
          const location = data.location || {};
          const ranges = data.period_ranges || {};
          const air = data.air_quality?.period_ranges || {};
          const place = [location.name, location.admin1, location.country].filter(Boolean).join(" · ");
          const usable = ["ok", "partial"].includes(data.status);
          return `<details open><summary>${escapeHtml(place || "天气查询")} · ${escapeHtml(labels[data.status] || "未确认")}</summary>
            ${data.message ? `<p>${escapeHtml(data.message)}</p>` : ""}
            ${data.locations?.length ? `<p>候选地点：${escapeHtml(data.locations.map(place => [place.name, place.admin1, place.country].filter(Boolean).join(" / ")).join("；"))}</p>` : ""}
            ${usable ? `<p>${escapeHtml(data.forecast_date || "")} ${escapeHtml(periods[data.period] || "")}（当地时间 ${escapeHtml(data.period_hours_local || "")}）</p>
              <p>温度：${range(ranges.temperature_2m, "°C")}；体感：${range(ranges.apparent_temperature, "°C")}；湿度：${range(ranges.relative_humidity_2m, "%")}</p>
              <p>风速：${range(ranges.wind_speed_10m, "m/s")}；阵风：${range(ranges.wind_gusts_10m, "m/s")}；降水概率：${range(ranges.precipitation_probability, "%")}</p>
              <p>PM2.5：${range(air.pm2_5, "µg/m³")}；PM10：${range(air.pm10, "µg/m³")}；美国 AQI：${range(air.us_aqi, "")}</p>
              <p class="meta">模型估计/预报，并非实测或官方预警；美国 AQI 不等于中国 AQI。空缺不是零。</p>
              <p class="meta">获取时间：${escapeHtml(data.fetched_at || "未提供")}${data.cached ? "（短时缓存）" : ""}</p>
              <p class="meta">来源：<a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> · <a href="https://ads.atmosphere.copernicus.eu/" target="_blank" rel="noopener noreferrer">CAMS</a> · <a href="https://www.geonames.org/" target="_blank" rel="noopener noreferrer">GeoNames</a></p>` : ""}
            ${data.warnings?.length ? `<p class="meta">${escapeHtml(data.warnings.join("；"))}</p>` : ""}
          </details>`;
        }).join("")}</div>`;
      }

      function renderDiagnostics(diagnostics) {
        if (!diagnostics?.stages) return "";
        const labels = {analysis: "情绪分析", scenario: "场景判断", "context.load": "上下文读取", "memory.retrieve": "历史检索", "reply.generate": "候选生成", "reply.understand_generate": "理解与生成", "reply.regenerate": "单条重生成", "quality.review": "质量检查", "quality.targeted": "定向检查", "quality.single": "单条质量检查", "memory.enqueue": "记忆任务排队", "memory.contact": "联系人记忆", "memory.summary": "概要保存", "memory.episode": "历史片段保存", "style.learn": "风格学习", "model.text": "文本模型调用", "model.vision": "视觉模型调用"};
        labels["quality.enqueue"] = "提交后台评估";
        labels["quality.background"] = "后台模型评估";
        return `<details><summary>本次生成耗时 ${(diagnostics.total_ms / 1000).toFixed(2)} 秒（不含后台评估）</summary>
          <p class="meta">请求编号：${escapeHtml(diagnostics.request_id)}。模型调用包含在所属步骤内，耗时不可直接相加。</p>
          <ul>${diagnostics.stages.map((item) => `<li>${escapeHtml(item.stage === "tool.weather" ? "MCP 天气查询" : item.stage.endsWith(".round") ? "模型单轮请求" : labels[item.stage] || item.stage)}：${(item.duration_ms / 1000).toFixed(2)} 秒${item.status === "error" ? "（调用异常）" : item.status === "skipped" ? "（未调用模型）" : ""}</li>`).join("")}</ul></details>`;
      }

      function renderTopicSummary(chat) {
        const topic = chat?.topic_source === "context" ? chat.topic?.trim() : "";
        return `<p data-topic><strong>主题（模型概括）：</strong>${escapeHtml(topic || "暂无法概括")}</p>`;
      }

      function invalidateTopic() {
        stopQualityPolling(latestResponse, "聊天内容已修改，旧评估不再适用。");
        for (const chat of [pendingExtraction, latestResponse?.extracted_chat]) {
          if (chat) {
            chat.topic = "";
            chat.topic_source = "pending";
          }
        }
        if (latestResponse) contextNeedsRegeneration = true;
        result.querySelectorAll("[data-topic]").forEach((element) => {
          element.textContent = "主题：内容已修改，待重新分析";
        });
      }

      function buildCorrectedPayload() {
        const correctedChat = collectEditedChat(latestResponse.extracted_chat);
        return buildChatPayload(
          correctedChat,
          latestResponse.relation_type,
          latestResponse.contact_id,
          form.elements.contact_name.value || latestResponse.contact_name,
        );
      }

      function collectEditedChat(baseChat) {
        const correctedChat = structuredClone(baseChat);
        correctedChat.topic = "";
        correctedChat.topic_source = "pending";
        const rows = Array.from(result.querySelectorAll("[data-message-index]"));

        correctedChat.messages = rows.map((row) => {
          const index = Number(row.dataset.messageIndex);
          const original = baseChat.messages[index] || {};
          return {
            ...original,
            speaker: row.querySelector('[data-field="speaker"]').value,
            side: row.querySelector('[data-field="side"]').value,
            text: row.querySelector('[data-field="text"]').value.trim(),
            time: original.time || null,
          };
        }).filter((item) => item.text);

        correctedChat.last_message_from_other = "";
        correctedChat.messages.forEach((item) => {
          if (item.speaker === "other") {
            correctedChat.last_message_from_other = item.text;
          }
        });
        return correctedChat;
      }

      function buildChatPayload(extractedChat, relationType, contactId, contactName) {
        return {
          relation_type: relationType,
          user_id: new FormData(form).get("user_id") || "default",
          contact_id: contactId || "default-contact",
          contact_name: contactName || "",
          extracted_chat: extractedChat,
          background_context: getBackgroundContext(),
          controls: collectReplyControls(),
          save_to_memory: form.elements.save_to_memory.checked,
        };
      }

      function collectReplyControls() {
        return {
          intent: form.elements.reply_intent.value,
          custom_intent: form.elements.custom_intent.value.trim(),
          length_preference: form.elements.length_preference.value,
          intimacy_level: Number(form.elements.intimacy_level.value),
          initiative_level: Number(form.elements.initiative_level.value),
        };
      }

      function describeControlsForDisplay(controls) {
        const intentLabels = {
          auto: "让系统判断",
          agree: "答应 / 接受",
          decline: "拒绝 / 婉拒",
          comfort: "安慰对方",
          explain: "解释清楚",
          advance: "主动推进",
          cool_down: "先降温",
          end_topic: "结束话题",
          ask_clarify: "问清楚",
        };
        const lengthLabels = { very_short: "很短", short: "短句", normal: "稍完整" };
        const intimacyLabels = { 1: "克制", 2: "自然", 3: "更亲近" };
        const initiativeLabels = { 1: "只回应", 2: "自然接话", 3: "主动推进" };
        return {
          intent: intentLabels[controls.intent] || controls.intent,
          custom: controls.custom_intent || "",
          length: lengthLabels[controls.length_preference] || controls.length_preference,
          intimacy: intimacyLabels[controls.intimacy_level] || controls.intimacy_level,
          initiative: initiativeLabels[controls.initiative_level] || controls.initiative_level,
        };
      }

      function chatWasEdited(originalChat, editedChat) {
        if (originalChat.messages.length !== editedChat.messages.length) {
          return true;
        }
        return originalChat.messages.some((item, index) => {
          const edited = editedChat.messages[index] || {};
          return item.speaker !== edited.speaker
            || item.side !== edited.side
            || item.text.trim() !== String(edited.text || "").trim();
        });
      }

      function createErrorBox(message) {
        const box = document.createElement("div");
        box.className = "card error";
        box.textContent = message;
        return box;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatDate(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return new Intl.DateTimeFormat("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).format(date);
      }

      function renderStylePhrases(phrases, label) {
        if (!phrases?.length) return "";
        return `
          <div class="meta"><strong>${escapeHtml(label)}：</strong></div>
          <div class="style-evidence-list">
            ${phrases.map((phrase) => `<span class="style-evidence-phrase">${escapeHtml(phrase)}</span>`).join("")}
          </div>
        `;
      }

      function renderBackgroundEvidence(context, compact = false) {
        const value = String(context || "").trim();
        if (!value) return "";
        if (compact) {
          return `
            <div class="review-banner">
              <strong>同时参考补充背景</strong>
              <p class="background-evidence">${escapeHtml(value)}</p>
              <span class="meta">这是概括性说明；与截图消息冲突时以截图为准。</span>
            </div>
          `;
        }
        return `
          <div class="card">
            <h2>补充聊天背景</h2>
            <p class="background-evidence">${escapeHtml(value)}</p>
            <p class="meta">由用户提供的概括，仅用于补足来龙去脉，不视为双方逐字原话，也不会用于学习用户说话风格。</p>
          </div>
        `;
      }
    </script>
  </body>
</html>
